name: Finalize FE MathJax repair

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/fix-fe-math.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Finalize inline formula and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('FE_4_Pillars_Architecture_Guide.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace(r'$\ge 3.0\times$', r'\(\ge 3.0\times\)')
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/fix-fe-math.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FE_4_Pillars_Architecture_Guide.html
          git commit -m 'Finalize FE MathJax repair'
          git push origin gh-pages
