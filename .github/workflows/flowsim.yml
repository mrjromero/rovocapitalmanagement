name: FlowSim validation

on:
  pull_request:
    branches: [gh-pages]
    paths: ['FlowSimV2.html', 'FlowSimV3.html', 'FlowSimV4.html', 'docs/flowsim-v*.md', 'flowsim.html', 'assets/flowsim/**', 'tests/flowsim*', 'tests/fixtures/flowsim-reference.json', '.github/workflows/flowsim.yml']
  push:
    branches: [gh-pages]
    paths: ['FlowSimV2.html', 'FlowSimV3.html', 'FlowSimV4.html', 'docs/flowsim-v*.md', 'flowsim.html', 'assets/flowsim/**', 'tests/flowsim*', 'tests/fixtures/flowsim-reference.json', '.github/workflows/flowsim.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/flowsim-deps" --no-save --ignore-scripts jsdom@30.1.3
      - name: Engine and exhaustive precision tests
        run: node --test --test-isolation=none tests/flowsim*.test.js
      - name: Sequential DOM, CSV, chart and release checks
        env:
          NODE_PATH: ${{ runner.temp }}/flowsim-deps/node_modules
        run: |
          set -euo pipefail
          for test in tests/flowsim*.cjs; do node "$test"; done
