name: Validate BLS Calendar Cache

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/refresh-bls-calendar.yml'
      - 'data/bls-calendar.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages

      - name: Validate normalized BLS calendar cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, re
          from pathlib import Path

          path = Path("data/bls-calendar.json")
          if not path.is_file():
              raise SystemExit("BLS cache validation failed closed: cache file missing")

          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except Exception as e:
              raise SystemExit(f"BLS cache validation failed closed: invalid JSON: {e}")

          if payload.get("schemaVersion") != 1:
              raise SystemExit("BLS cache validation failed closed: unsupported schemaVersion")
          if payload.get("upstream", {}).get("authority") != "U.S. Bureau of Labor Statistics":
              raise SystemExit("BLS cache validation failed closed: upstream authority mismatch")
          if payload.get("upstream", {}).get("calendarUrl") != "https://www.bls.gov/schedule/news_release/bls.ics":
              raise SystemExit("BLS cache validation failed closed: official calendar URL mismatch")

          try:
              generated = datetime.datetime.fromisoformat(payload["generatedAt"].replace("Z", "+00:00"))
          except Exception as e:
              raise SystemExit(f"BLS cache validation failed closed: generatedAt invalid: {e}")
          if generated.tzinfo is None:
              raise SystemExit("BLS cache validation failed closed: generatedAt must be timezone-aware")
          if generated > datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(minutes=5):
              raise SystemExit("BLS cache validation failed closed: generatedAt is in the future")

          max_age = payload.get("maxAgeHours")
          if not isinstance(max_age, (int, float)) or max_age <= 0 or max_age > 36:
              raise SystemExit("BLS cache validation failed closed: maxAgeHours must be within (0, 36]")

          events = payload.get("events")
          if not isinstance(events, list) or not events:
              raise SystemExit("BLS cache validation failed closed: events missing or empty")

          wanted = {"Employment Situation", "Consumer Price Index", "Producer Price Index"}
          counts = {title: 0 for title in wanted}
          seen = set()
          for event in events:
              title = event.get("title")
              if title not in wanted:
                  raise SystemExit(f"BLS cache validation failed closed: unexpected title {title!r}")
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", event.get("releaseDate", "")):
                  raise SystemExit(f"BLS cache validation failed closed: invalid releaseDate for {title}")
              if event.get("releaseTime") != "08:30":
                  raise SystemExit(f"BLS cache validation failed closed: unexpected releaseTime for {title}")
              if event.get("timezone") != "America/New_York":
                  raise SystemExit(f"BLS cache validation failed closed: unexpected timezone for {title}")
              source = event.get("sourceUrl", "")
              if not source.startswith("https://www.bls.gov/"):
                  raise SystemExit(f"BLS cache validation failed closed: non-BLS source for {title}")
              key = (title, event["releaseDate"], event["releaseTime"])
              if key in seen:
                  raise SystemExit(f"BLS cache validation failed closed: duplicate event {key}")
              seen.add(key)
              counts[title] += 1

          missing = [title for title, count in counts.items() if count == 0]
          if missing:
              raise SystemExit("BLS cache validation failed closed: missing release series: " + ", ".join(missing))

          print(f"BLS cache integrity valid: {len(events)} events; generatedAt={payload['generatedAt']}; maxAgeHours={max_age}")
          print("Network acquisition is intentionally outside GitHub-hosted runners because BLS returns HTTP 403 to that execution environment.")
          PY
