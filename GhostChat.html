<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GhostChat</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      /* Ghostbusters Theme Colors */
      --primary: #ff0000;       
      --primary-active: #cc0000;
      --slime: #39ff14;         
      --caution: #ffcc00;       
      
      --bg: #111111;            
      --card-bg: #222222;       
      --border: #444444;
      --text: #eeeeee;
      --subtext: #aaaaaa;
      
      --bubble-out: var(--slime);
      --bubble-out-text: #000000;
      --bubble-in: #333333;
      --bubble-in-text: #ffffff;
      
      --safe-bottom: env(safe-area-inset-bottom, 12px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
    }

    .app-container {
      background: var(--bg);
      width: 100%;
      max-width: 500px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Bar */
    .app-header {
      background: #000000;
      padding: 12px 16px;
      border-bottom: 4px solid var(--caution);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      background-image: repeating-linear-gradient(
        45deg,
        rgba(255, 204, 0, 0.1) 0px,
        rgba(255, 204, 0, 0.1) 10px,
        rgba(0, 0, 0, 0) 10px,
        rgba(0, 0, 0, 0) 20px
      );
    }

    .app-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.3rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--bg);
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--caution);
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--primary);
      box-shadow: 0 0 5px var(--primary);
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    /* Video Container & Controls */
    #video-container {
      display: none;
      background: #000;
      padding: 12px;
      gap: 10px;
      overflow-x: auto;
      align-items: center;
      border-bottom: 2px solid var(--border);
      z-index: 5;
    }

    .video-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    #video-container video {
      height: 120px;
      border-radius: 6px;
      background: #222;
      object-fit: cover;
      display: block;
      transition: all 0.3s ease;
    }

    #local-video {
      border: 2px solid var(--slime);
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
    }

    #video-container video:not(#local-video) {
      border: 2px solid #555;
      cursor: pointer;
    }

    /* Fullscreen Video Class */
    .video-fullscreen {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999;
      border-radius: 0 !important;
      border: none !important;
      background: #000;
      object-fit: contain !important;
    }

    /* Local Video Overlay Controls */
    .vid-ctrls {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 20px;
    }
    
    .vid-btn {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      padding: 2px;
      cursor: pointer;
    }
    .vid-btn.muted { color: var(--primary); }

    /* Scrollable Content Body */
    .scroll-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    /* Mobile Cards */
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="text"] {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px;
      background: #111;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--slime);
      box-shadow: 0 0 5px rgba(57, 255, 20, 0.2);
    }

    .btn {
      height: 44px;
      padding: 0 16px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: 'Share Tech Mono', monospace;
    }

    .btn:active { background-color: var(--primary-active); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-secondary {
      background-color: #444;
      height: 36px;
      padding: 0 12px;
      font-size: 13px;
    }

    /* Collapsible QR Section */
    #qr-container {
      display: none;
      text-align: center;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      margin-top: 5px;
    }
    #qr-container canvas {
      border: 4px solid #fff;
      border-radius: 6px;
    }

    /* Chat Area */
    #chat-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 180px;
      padding-bottom: 20px;
    }

    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }
    .bubble-out { align-self: flex-end; background-color: var(--bubble-out); color: var(--bubble-out-text); border-bottom-right-radius: 2px; font-weight: 500; }
    .bubble-in { align-self: flex-start; background-color: var(--bubble-in); color: var(--bubble-in-text); border-bottom-left-radius: 2px; border: 1px solid var(--border); }
    
    .bubble-author { font-size: 11px; font-weight: bold; margin-bottom: 4px; opacity: 0.8; font-family: 'Share Tech Mono', monospace; }
    .system-pill { align-self: center; background: rgba(255, 204, 0, 0.15); color: var(--caution); border: 1px solid rgba(255, 204, 0, 0.3); font-family: 'Share Tech Mono', monospace; font-size: 11px; padding: 4px 12px; border-radius: 4px; margin: 4px 0; text-align: center; }

    /* Floating Action Menu */
    .action-menu {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.2s ease;
      z-index: 20;
    }
    
    .action-menu.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .action-item {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      padding: 10px 16px;
      text-align: left;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .action-item:active { background: #333; }
    .action-item:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Bottom Input Bar */
    .input-bar {
      background: #111111;
      padding: 10px 12px calc(10px + var(--safe-bottom)) 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      position: relative;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #333;
      color: #fff;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .icon-btn:active { background: #444; }
    
    .send-btn { width: 44px; height: 44px; border-radius: 50%; padding: 0; background: var(--slime); color: #000; }
    .send-btn:active { background: #2ebd10; }
    
    a.download-card { display: flex; align-items: center; gap: 10px; color: var(--slime); text-decoration: none; background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 6px; margin-top: 6px; font-family: 'Share Tech Mono', monospace; font-size: 14px; border: 1px solid #444; }

  </style>
</head>
<body>
  <div class="app-container">
    
    <header class="app-header">
      <div class="app-title">👻 GHOSTCHAT 🚫</div>
      <div class="status-badge">
        <div id="status-dot" class="status-dot"></div>
        <span id="conn-status">OFFLINE</span>
      </div>
    </header>

    <div id="video-container">
      <div class="video-wrapper" id="local-vid-wrap">
        <video id="local-video" autoplay playsinline muted></video>
        <div class="vid-ctrls">
          <button id="btn-flip" class="vid-btn" title="Flip Camera">🔄</button>
          <button id="btn-mute" class="vid-btn" title="Mute Mic">🎤</button>
        </div>
      </div>
    </div>

    <div class="scroll-body">
      <!-- Setup Card -->
      <div class="card" id="setup-card">
        <div class="row">
          <input type="text" id="display-name" placeholder="Agent Designation (Name)">
        </div>
        <div class="row" style="justify-content: space-between;">
          <button id="share-btn" class="btn btn-secondary" style="flex:1; margin-right:5px;" disabled>COPY LINK</button>
          <button id="toggle-qr-btn" class="btn btn-secondary" style="flex:1; margin-left:5px;" disabled>SHOW QR</button>
        </div>
        <div id="qr-container">
          <canvas id="qr-canvas"></canvas>
          <div style="font-size:11px; margin-top:8px; color:var(--caution); font-family:monospace;">SCAN TO CONNECT</div>
        </div>
      </div>

      <div id="chat-box"></div>
    </div>

    <!-- Bottom Input Area -->
    <footer class="input-bar">
      <!-- Hidden File Input -->
      <input type="file" id="file-input" hidden>
      
      <!-- The Pop-up Action Menu -->
      <div id="action-menu" class="action-menu">
        <button class="action-item" id="menu-file" disabled>📎 Transmit File</button>
        <button class="action-item" id="menu-video" disabled>📹 Start Camera</button>
        <button class="action-item" id="menu-screen" disabled>🖥️ Share Screen</button>
      </div>

      <!-- Add Button replaces all the clutter -->
      <button id="add-btn" class="icon-btn" title="Actions">+</button>
      
      <input type="text" id="msg-input" placeholder="Transmit signal..." disabled>
      <button id="send-btn" class="btn send-btn" disabled>➔</button>
    </footer>

  </div>

  <script>
    const CHUNK_SIZE = 16384;
    let myPeerId = null;
    const connections = new Map();
    const incomingTransfers = new Map();

    // --- Audio setup ---
    let audioCtx = null;
    const unlockAudio = () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      document.removeEventListener('click', unlockAudio);
      document.removeEventListener('touchstart', unlockAudio);
    };
    document.addEventListener('click', unlockAudio);
    document.addEventListener('touchstart', unlockAudio);

    function playNotificationSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const t = audioCtx.currentTime;
        const playTone = (freq, startTime) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square'; 
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.05, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.15);
        };
        playTone(600, t);        
        playTone(1200, t + 0.1); 
      } catch (e) {}
    }

    // --- Name Setup ---
    const ADJ = ['Spooky', 'Ecto', 'Spectral', 'Phantom', 'Slime', 'Proton', 'Ghost', 'Venkman', 'Stantz'];
    const ANI = ['Agent', 'Buster', 'Trap', 'Pack', 'Meter', 'Entity', 'Specter', 'Ghoul', 'Spirit'];
    const nameInput = document.getElementById('display-name');
    nameInput.value = localStorage.getItem('ghost_name') || `${ADJ[Math.floor(Math.random()*ADJ.length)]} ${ANI[Math.floor(Math.random()*ANI.length)]}`;
    
    nameInput.addEventListener('change', () => {
      localStorage.setItem('ghost_name', nameInput.value.trim());
      broadcast({ type: 'identity', name: nameInput.value.trim() });
    });

    // --- Peer Setup ---
    const peer = new Peer({ 
      config: { 
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ] 
      } 
    });

    peer.on('open', (id) => {
      myPeerId = id;
      const shareUrl = `${window.location.origin}${window.location.pathname}?id=${id}`;
      
      const shareBtn = document.getElementById('share-btn');
      const toggleQrBtn = document.getElementById('toggle-qr-btn');
      shareBtn.disabled = false;
      toggleQrBtn.disabled = false;
      
      shareBtn.onclick = async () => {
        if (navigator.share) {
          try { await navigator.share({ title: 'GhostChat', url: shareUrl }); } catch(e){}
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(shareUrl);
          shareBtn.innerText = 'COPIED!';
          setTimeout(() => shareBtn.innerText = 'COPY LINK', 2000);
        }
      };

      // Generate QR
      const qrCanvas = document.getElementById('qr-canvas');
      new QRious({ element: qrCanvas, value: shareUrl, size: 180 });
      
      toggleQrBtn.onclick = () => {
        const qrCont = document.getElementById('qr-container');
        if (qrCont.style.display === 'block') {
          qrCont.style.display = 'none';
          toggleQrBtn.innerText = 'SHOW QR';
        } else {
          qrCont.style.display = 'block';
          toggleQrBtn.innerText = 'HIDE QR';
        }
      };

      updateUI();

      const targetId = new URLSearchParams(window.location.search).get('id');
      if (targetId) connectToPeer(targetId);
    });

    peer.on('connection', (conn) => setupConnection(conn));

    function connectToPeer(remoteId) {
      if (remoteId === myPeerId || connections.has(remoteId)) return;
      setupConnection(peer.connect(remoteId));
    }

    function setupConnection(conn) {
      conn.on('open', () => {
        connections.set(conn.peer, conn);
        updateUI();
        conn.send({ type: 'identity', name: nameInput.value.trim() });
      });
      conn.on('data', (data) => processData(data, conn.peer));
      const cleanup = () => {
        if (!connections.has(conn.peer)) return;
        const peerName = connections.get(conn.peer).name || conn.peer;
        connections.delete(conn.peer);
        updateUI();
        logSystem(`Agent ${peerName} disconnected`);
      };
      conn.on('close', cleanup);
      conn.on('error', cleanup);
    }

    function broadcast(data) {
      connections.forEach(conn => { if (conn.open) conn.send(data); });
    }

    function updateUI() {
      const active = connections.size > 0;
      document.getElementById('msg-input').disabled = !active;
      document.getElementById('send-btn').disabled = !active;
      
      // Enable Menu items
      document.getElementById('menu-file').disabled = !active;
      document.getElementById('menu-video').disabled = !active;
      document.getElementById('menu-screen').disabled = !active;
      
      // Status dot
      if (myPeerId) {
        document.getElementById('conn-status').textContent = `${connections.size} AGENT${connections.size === 1 ? '' : 'S'} ONLINE`;
        const dot = document.getElementById('status-dot');
        dot.style.backgroundColor = connections.size === 0 ? '#ff0000' : '#39ff14';
        dot.style.boxShadow = `0 0 8px ${connections.size === 0 ? '#ff0000' : '#39ff14'}`;
      }

      // Auto-hide QR when someone joins
      if (active) {
        document.getElementById('qr-container').style.display = 'none';
        document.getElementById('toggle-qr-btn').innerText = 'SHOW QR';
      }
    }

    function processData(data, senderId) {
      const conn = connections.get(senderId);
      const senderName = conn?.name || senderId;

      if (typeof data === 'string') {
        playNotificationSound();
        return logBubble(senderName, data, false);
      }
      if (data.type === 'identity') {
        if (conn && conn.name !== data.name) {
          conn.name = data.name;
          logSystem(`${data.name} entered the unit`);
        }
        return;
      }
      // ... File transfer logic ...
      if (data.type === 'file-header') {
        incomingTransfers.set(senderId, { name: data.name, type: data.filetype, chunks: [] });
      } else if (data.type === 'file-chunk') {
        incomingTransfers.get(senderId)?.chunks.push(data.chunk);
      } else if (data.type === 'file-complete') {
        const transfer = incomingTransfers.get(senderId);
        if (transfer) {
          const blob = new Blob(transfer.chunks, { type: transfer.type });
          playNotificationSound();
          logDownload(senderName, URL.createObjectURL(blob), transfer.name);
          incomingTransfers.delete(senderId);
        }
      }
    }

    // --- Action Menu Logic ---
    const addBtn = document.getElementById('add-btn');
    const actionMenu = document.getElementById('action-menu');
    
    addBtn.onclick = (e) => {
      e.stopPropagation();
      const isActive = actionMenu.classList.contains('active');
      actionMenu.classList.toggle('active', !isActive);
      addBtn.style.transform = !isActive ? 'rotate(45deg)' : 'rotate(0deg)';
      addBtn.style.transition = 'transform 0.2s';
    };

    document.addEventListener('click', (e) => {
      if (!actionMenu.contains(e.target) && e.target !== addBtn) {
        actionMenu.classList.remove('active');
        addBtn.style.transform = 'rotate(0deg)';
      }
    });

    // --- MEDIA SYSTEM ---
    let localStream = null;
    let screenStream = null;
    let currentFacingMode = "user"; // Start with front camera
    
    const videoContainer = document.getElementById('video-container');
    const localVideo = document.getElementById('local-video');
    const menuVidBtn = document.getElementById('menu-video');
    
    // Mute/Unmute
    document.getElementById('btn-mute').onclick = () => {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        const btn = document.getElementById('btn-mute');
        btn.textContent = audioTrack.enabled ? '🎤' : '🔇';
        btn.classList.toggle('muted', !audioTrack.enabled);
      }
    };

    // Flip Camera
    document.getElementById('btn-flip').onclick = async () => {
      if (!localStream) return;
      currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
      
      try {
        const newStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: currentFacingMode }, 
          audio: true 
        });
        
        // Grab new tracks
        const newVideoTrack = newStream.getVideoTracks()[0];
        const newAudioTrack = newStream.getAudioTracks()[0];

        // Replace track on all active connections seamlessly
        Object.values(peer.connections).forEach(peerConns => {
          peerConns.forEach(conn => {
            if (conn.type === 'media' && conn.peerConnection) {
              const senders = conn.peerConnection.getSenders();
              const vidSender = senders.find(s => s.track && s.track.kind === 'video');
              if (vidSender) vidSender.replaceTrack(newVideoTrack);
            }
          });
        });

        // Kill old tracks and update local feed
        localStream.getTracks().forEach(t => t.stop());
        localStream = newStream;
        localVideo.srcObject = localStream;
        
        // Reset mute button state
        document.getElementById('btn-mute').textContent = '🎤';
        document.getElementById('btn-mute').classList.remove('muted');

      } catch (err) {
        logSystem("Failed to flip camera.");
      }
    };

    // Answer calls silently
    peer.on('call', (call) => {
      const callerName = connections.get(call.peer)?.name || call.peer;
      logSystem(`Receiving visual feed from ${callerName}...`);
      playNotificationSound();
      call.answer(screenStream || localStream || undefined); 
      handleCallStream(call);
    });

    // Start/Stop Camera
    menuVidBtn.onclick = async () => {
      actionMenu.classList.remove('active');
      addBtn.style.transform = 'rotate(0deg)';

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop()); 
        localStream = null;
        if (!screenStream) videoContainer.style.display = 'none';
        menuVidBtn.textContent = '📹 Start Camera';
        videoContainer.querySelectorAll('.remote-vid-wrap').forEach(v => v.remove());
        logSystem("Camera disabled.");
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: {facingMode: currentFacingMode}, audio: true });
        localVideo.srcObject = localStream;
        videoContainer.style.display = 'flex';
        menuVidBtn.textContent = '⏹️ Stop Camera';
        logSystem("Broadcasting camera feed...");

        connections.forEach((conn) => {
          const call = peer.call(conn.peer, localStream);
          handleCallStream(call);
        });
      } catch (err) {
        alert("Camera access denied.");
      }
    };

    // Start/Stop Screen
    document.getElementById('menu-screen').onclick = async () => {
      actionMenu.classList.remove('active');
      addBtn.style.transform = 'rotate(0deg)';
      const screenBtn = document.getElementById('menu-screen');

      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
        screenBtn.textContent = '🖥️ Share Screen';
        logSystem("Screen sharing stopped.");
        return;
      }

      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        screenBtn.textContent = '⏹️ Stop Screen Share';
        logSystem("Broadcasting screen...");
        
        screenStream.getVideoTracks()[0].onended = () => {
          screenStream = null;
          screenBtn.textContent = '🖥️ Share Screen';
        };

        connections.forEach((conn) => {
          const call = peer.call(conn.peer, screenStream);
          handleCallStream(call);
        });
      } catch (err) {}
    };

    // Render Remote Video
    function handleCallStream(call) {
      call.on('stream', (remoteStream) => {
        if (document.getElementById(`vid-${remoteStream.id}`)) return;

        videoContainer.style.display = 'flex';
        
        const wrap = document.createElement('div');
        wrap.className = 'video-wrapper remote-vid-wrap';
        wrap.id = `wrap-${remoteStream.id}`;

        const remoteVid = document.createElement('video');
        remoteVid.id = `vid-${remoteStream.id}`;
        remoteVid.srcObject = remoteStream;
        remoteVid.autoplay = true;
        remoteVid.playsInline = true;
        
        // Tap to fullscreen
        remoteVid.addEventListener('click', () => {
          remoteVid.classList.toggle('video-fullscreen');
        });

        wrap.appendChild(remoteVid);
        videoContainer.appendChild(wrap);
      });

      call.on('close', cleanDeadVideos);
      peer.on('connection', (conn) => conn.on('close', cleanDeadVideos));
    }

    function cleanDeadVideos() {
      videoContainer.querySelectorAll('.remote-vid-wrap').forEach(v => v.remove());
      if (!localStream && !screenStream) videoContainer.style.display = 'none';
    }

    // --- Chat & File Handlers ---
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const fileInput = document.getElementById('file-input');
    
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });
    msgInput.addEventListener('focus', () => setTimeout(scrollToBottom, 300));

    sendBtn.onclick = () => {
      const text = msgInput.value.trim();
      if (text) {
        broadcast(text);
        logBubble('You', text, true);
        msgInput.value = '';
      }
    };

    document.getElementById('menu-file').onclick = () => {
      actionMenu.classList.remove('active');
      addBtn.style.transform = 'rotate(0deg)';
      fileInput.click();
    };

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;
      if (file.size > 250 * 1024 * 1024) return alert(`File too large (${Math.round(file.size/1024/1024)}MB).`);
      
      fileInput.value = '';
      logSystem(`Transmitting ${file.name}...`);
      broadcast({ type: 'file-header', name: file.name, filetype: file.type });

      let offset = 0;
      while (offset < file.size) {
        let maxBuffer = 0;
        connections.forEach(c => {
          if (c.dataChannel && c.dataChannel.bufferedAmount > maxBuffer) maxBuffer = c.dataChannel.bufferedAmount;
        });
        if (maxBuffer > 1024 * 1024) { await new Promise(r => setTimeout(r, 50)); continue; }
        
        const buffer = await file.slice(offset, offset + CHUNK_SIZE).arrayBuffer();
        broadcast({ type: 'file-chunk', chunk: buffer });
        offset += CHUNK_SIZE;
      }
      broadcast({ type: 'file-complete' });
      logSystem(`Sent ${file.name}`);
    };

    // --- Utilities ---
    function scrollToBottom() {
      const sb = document.querySelector('.scroll-body');
      if (sb) sb.scrollTo({ top: sb.scrollHeight, behavior: 'smooth' });
    }

    function escapeHTML(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function logBubble(sender, text, isOut) {
      const chat = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `bubble ${isOut ? 'bubble-out' : 'bubble-in'}`;
      div.innerHTML = `<div class="bubble-author">${escapeHTML(sender)}</div><div>${escapeHTML(text)}</div>`;
      chat.appendChild(div);
      scrollToBottom();
    }

    function logSystem(text) {
      const chat = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'system-pill'; div.textContent = text;
      chat.appendChild(div); scrollToBottom();
    }

    function logDownload(sender, url, filename) {
      const chat = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'bubble bubble-in';
      div.innerHTML = `<div class="bubble-author">${escapeHTML(sender)}</div>
                       <a class="download-card" href="${url}" download="${escapeHTML(filename)}">⬇️ DOWNLOAD ${escapeHTML(filename).toUpperCase()}</a>`;
      div.querySelector('a').onclick = () => setTimeout(() => URL.revokeObjectURL(url), 10000);
      chat.appendChild(div);
      scrollToBottom();
    }
  </script>
</body>
</html>
