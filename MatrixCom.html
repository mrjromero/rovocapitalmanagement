<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MatrixCom</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      --primary: #00ff41;       
      --primary-active: #00cc33;
      --glow: #00ff41;         
      --caution: #00ff41;       
      
      --bg: #030703;            
      --card-bg: rgba(8, 18, 8, 0.88);       
      --border: #005511;
      --border-bright: #00ff41;
      --text: #00ff41;
      --subtext: #009922;
      
      --bubble-out: #002b00;
      --bubble-out-text: #00ff41;
      --bubble-in: #051405;
      --bubble-in-text: #a3ffa3;
      
      --safe-bottom: env(safe-area-inset-bottom, 12px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Share Tech Mono', monospace;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
      text-shadow: 0 0 3px rgba(0, 255, 65, 0.4);
    }

    /* Matrix Rain Canvas */
    #matrix-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.25;
    }

    .app-container {
      background: rgba(3, 7, 3, 0.85);
      backdrop-filter: blur(4px);
      width: 100%;
      max-width: 1400px; 
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    /* Scanline effect */
    .app-container::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 99;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Top Bar */
    .app-header {
      background: #000000;
      padding: 12px 16px;
      border-bottom: 2px solid var(--primary);
      box-shadow: 0 0 12px rgba(0, 255, 65, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      background-image: repeating-linear-gradient(
        45deg,
        rgba(0, 255, 65, 0.08) 0px,
        rgba(0, 255, 65, 0.08) 10px,
        rgba(0, 0, 0, 0) 10px,
        rgba(0, 0, 0, 0) 20px
      );
    }

    .app-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.3rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .status-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: #000;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      padding: 4px 10px;
      border-radius: 2px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 0 8px var(--primary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #000;
      box-shadow: 0 0 5px #000;
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    /* Video Container & Controls */
    #video-container {
      display: none;
      background: #000;
      padding: 12px;
      gap: 10px;
      overflow-x: auto;
      align-items: center;
      border-bottom: 2px solid var(--border);
      z-index: 5;
      position: relative;
    }

    /* Sticky Toolbar for Video actions */
    #video-toolbar {
      position: sticky;
      left: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #000;
      padding-right: 8px;
    }

    #local-vid-wrap {
      display: none; 
      position: relative;
      flex-shrink: 0;
    }

    .remote-vid-wrap {
      position: relative;
      flex-shrink: 0;
    }

    #video-container video {
      height: 120px;
      border-radius: 2px;
      background: #051005;
      object-fit: cover;
      display: block;
      transition: all 0.3s ease;
    }

    #local-video {
      border: 2px solid var(--primary);
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
    }

    #video-container video:not(#local-video) {
      border: 2px solid var(--border);
      cursor: pointer;
    }

    .video-fullscreen {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999;
      border-radius: 0 !important;
      border: none !important;
      background: #000;
      object-fit: contain !important;
    }

    .vid-ctrls {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(0,0,0,0.85);
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    
    .vid-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 16px;
      padding: 2px;
      cursor: pointer;
    }
    .vid-btn.muted { color: #ff3333; }

    /* Theater Mode Classes */
    body.hide-ui .app-header, 
    body.hide-ui .scroll-body, 
    body.hide-ui .input-bar {
      display: none !important;
    }
    
    body.hide-ui #video-container {
      flex: 1;
      height: 100dvh;
      border: none;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
    }

    body.hide-ui #video-container video {
      height: auto;
      max-height: 80vh;
      max-width: 90vw;
      object-fit: contain;
    }

    body.hide-ui #video-toolbar {
      position: absolute;
      top: 15px;
      left: 15px;
      background: transparent;
    }

    /* Scrollable Content Body */
    .scroll-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .card {
      background: var(--card-bg);
      border-radius: 4px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .row { display: flex; align-items: center; gap: 8px; }

    input[type="text"] {
      width: 100%; height: 44px; padding: 0 12px;
      border: 1px solid var(--border); border-radius: 2px;
      font-size: 15px; background: #000; color: var(--text); outline: none;
      font-family: 'Share Tech Mono', monospace;
    }
    input[type="text"]:focus { 
      border-color: var(--primary); 
      box-shadow: 0 0 8px rgba(0, 255, 65, 0.4); 
    }

    .btn {
      height: 44px; padding: 0 16px; background-color: #000; color: var(--primary);
      border: 1px solid var(--primary); border-radius: 2px; font-size: 14px; font-weight: bold; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    .btn:hover, .btn:active { 
      background-color: var(--primary); 
      color: #000; 
      box-shadow: 0 0 12px var(--primary);
    }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--border); color: var(--subtext); box-shadow: none; }
    .btn-secondary { background-color: #030a03; border-color: var(--border); color: var(--subtext); height: 36px; padding: 0 12px; font-size: 12px; }
    .btn-secondary:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }

    #qr-container { display: none; text-align: center; padding-top: 10px; border-top: 1px solid var(--border); margin-top: 5px; }
    #qr-container canvas { border: 4px solid var(--primary); border-radius: 2px; box-shadow: 0 0 10px rgba(0, 255, 65, 0.3); }

    /* Chat Area */
    #chat-box { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 180px; padding-bottom: 20px; }
    
    .bubble { max-width: 80%; padding: 10px 14px; border-radius: 4px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .bubble-out { 
      align-self: flex-end; 
      background-color: var(--bubble-out); 
      color: var(--bubble-out-text); 
      border: 1px solid var(--border-bright);
      box-shadow: 0 0 6px rgba(0, 255, 65, 0.2);
    }
    .bubble-in { 
      align-self: flex-start; 
      background-color: var(--bubble-in); 
      color: var(--bubble-in-text); 
      border: 1px solid var(--border); 
    }
    .bubble-author { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: var(--subtext); font-family: 'Share Tech Mono', monospace; letter-spacing: 1px; }
    .system-pill { 
      align-self: center; 
      background: rgba(0, 255, 65, 0.08); 
      color: var(--primary); 
      border: 1px solid var(--border); 
      font-family: 'Share Tech Mono', monospace; 
      font-size: 11px; 
      padding: 4px 12px; 
      border-radius: 2px; 
      margin: 4px 0; 
      text-align: center; 
      letter-spacing: 1px;
    }

    /* Floating Action Menu */
    .action-menu {
      position: absolute; bottom: calc(100% + 10px); left: 12px;
      background: #000; border: 1px solid var(--primary); border-radius: 4px;
      padding: 8px; display: flex; flex-direction: column; gap: 6px;
      box-shadow: 0 0 15px rgba(0,255,65,0.3); opacity: 0; pointer-events: none;
      transform: translateY(10px); transition: all 0.2s ease; z-index: 20;
    }
    .action-menu.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .action-item {
      background: transparent; border: 1px solid transparent; color: var(--text); font-family: 'Share Tech Mono', monospace;
      font-size: 13px; padding: 8px 14px; text-align: left; border-radius: 2px; display: flex; align-items: center; gap: 10px; cursor: pointer;
    }
    .action-item:hover:not(:disabled), .action-item:active:not(:disabled) { background: #002200; border-color: var(--primary); }
    .action-item:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Bottom Input Bar */
    .input-bar {
      background: #000; padding: 10px 12px calc(10px + var(--safe-bottom)) 12px;
      border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; z-index: 10; position: relative;
    }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 2px; background: #000; color: var(--primary);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; flex-shrink: 0;
      font-family: 'Share Tech Mono', monospace;
    }
    .icon-btn:hover, .icon-btn:active { border-color: var(--primary); box-shadow: 0 0 8px rgba(0, 255, 65, 0.4); }
    .send-btn { 
      width: 44px; height: 44px; border-radius: 2px; padding: 0; 
      background: #000; color: var(--primary); border: 1px solid var(--primary);
    }
    .send-btn:hover, .send-btn:active { background: var(--primary); color: #000; box-shadow: 0 0 10px var(--primary); }
    a.download-card { display: flex; align-items: center; gap: 10px; color: var(--primary); text-decoration: none; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 2px; margin-top: 6px; font-family: 'Share Tech Mono', monospace; font-size: 13px; border: 1px solid var(--border); }
    a.download-card:hover { border-color: var(--primary); }

    /* Camera Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9);
      z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
    }
    .modal-card {
      background: #000; border: 2px solid var(--primary); border-radius: 4px;
      padding: 24px; width: 85%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 25px rgba(0,255,65,0.4);
    }
    .modal-title { color: var(--primary); font-family: 'Share Tech Mono', monospace; text-align: center; margin-bottom: 8px; font-size: 1rem; letter-spacing: 1px; }
    .cam-btn {
      background: #051005; color: var(--primary); border: 1px solid var(--border); padding: 12px; border-radius: 2px; font-size: 13px;
      cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; font-family: 'Share Tech Mono', monospace;
    }
    .cam-btn::before { content: '📹'; }
    .cam-btn:hover, .cam-btn:active { background: var(--primary); color: black; border-color: var(--primary); }
    .modal-close { background: transparent; color: var(--subtext); margin-top: 10px; border: 1px solid var(--border); }
    .modal-close:hover, .modal-close:active { background: #051005; color: var(--primary); border-color: var(--primary); }
  </style>
</head>
<body>
  <canvas id="matrix-bg"></canvas>

  <div class="app-container">
    <header class="app-header">
      <div class="app-title">📟 MATRIXCOM // v2.0</div>
      <div class="status-badge">
        <div id="status-dot" class="status-dot"></div>
        <span id="conn-status">DISCONNECTED</span>
      </div>
    </header>

    <div id="video-container">
      <div id="video-toolbar">
         <button id="toggle-ui-btn" class="icon-btn" style="width:36px; height:36px; font-size:14px;" title="Theater Mode">↕️</button>
      </div>

      <div id="local-vid-wrap">
        <video id="local-video" autoplay playsinline muted></video>
        <div class="vid-ctrls">
          <button id="btn-flip" class="vid-btn" title="Switch Camera">🔄</button>
          <button id="btn-mute" class="vid-btn" title="Mute Mic">🎤</button>
        </div>
      </div>
    </div>

    <div class="scroll-body">
      <div class="card" id="setup-card">
        <div class="row">
          <input type="text" id="display-name" placeholder="Operator Handle (Designation)">
        </div>
        <div class="row" style="justify-content: space-between;">
          <button id="share-btn" class="btn btn-secondary" style="flex:1; margin-right:5px;" disabled>COPY LINK</button>
          <button id="toggle-qr-btn" class="btn btn-secondary" style="flex:1; margin-left:5px;" disabled>SHOW QR</button>
        </div>
        <div id="qr-container">
          <canvas id="qr-canvas"></canvas>
          <div style="font-size:11px; margin-top:8px; color:var(--primary); font-family:'Share Tech Mono', monospace; letter-spacing:1px;">SCAN TO JACK IN</div>
        </div>
      </div>
      <div id="chat-box"></div>
    </div>

    <footer class="input-bar">
      <input type="file" id="file-input" hidden>
      <div id="action-menu" class="action-menu">
        <button class="action-item" id="menu-file" disabled>📎 Transmit Data Packet</button>
        <button class="action-item" id="menu-video" disabled>📹 Optical Feed</button>
        <button class="action-item" id="menu-screen" disabled>🖥️ Broadcast Terminal</button>
        <button class="action-item" id="menu-sound">🔊 Audio Chime: ON</button>
      </div>
      <button id="add-btn" class="icon-btn" title="Actions">+</button>
      
      <input type="text" id="msg-input" placeholder="Enter signal into the Matrix..." disabled>
      
      <button id="send-btn" class="btn send-btn" disabled>➔</button>
    </footer>
  </div>

  <div id="cam-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">SELECT OPTICAL SENSOR</div>
      <div id="cam-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      <button class="btn modal-close" onclick="closeCamModal()">ABORT</button>
    </div>
  </div>

  <script>
    // --- Matrix Rain Animation ---
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const alphabet = katakana + latin;
    const fontSize = 16;
    let columns = Math.floor(canvas.width / fontSize);
    let rainDrops = Array(columns).fill(1);

    function drawMatrixRain() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ff41';
      ctx.font = fontSize + 'px monospace';

      if (rainDrops.length !== Math.floor(canvas.width / fontSize)) {
        columns = Math.floor(canvas.width / fontSize);
        rainDrops = Array(columns).fill(1);
      }

      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          rainDrops[i] = 0;
        }
        rainDrops[i]++;
      }
    }
    setInterval(drawMatrixRain, 33);

    // --- PeerJS & Application Mechanics ---
    const CHUNK_SIZE = 16384;
    let myPeerId = null;
    const connections = new Map();
    const incomingTransfers = new Map();

    // --- Audio setup & State ---
    let audioCtx = null;
    let soundEnabled = true;

    const unlockAudio = () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      document.removeEventListener('click', unlockAudio); 
      document.removeEventListener('touchstart', unlockAudio);
    };
    document.addEventListener('click', unlockAudio); 
    document.addEventListener('touchstart', unlockAudio);

    function playNotificationSound() {
      if (!soundEnabled || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const t = audioCtx.currentTime;
        const playTone = (freq, startTime, duration = 0.08) => {
          const osc = audioCtx.createOscillator(); 
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth'; 
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0, startTime); 
          gain.gain.linearRampToValueAtTime(0.04, startTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.connect(gain); 
          gain.connect(audioCtx.destination);
          osc.start(startTime); 
          osc.stop(startTime + duration);
        };
        // Matrix style high-tech synth beep
        playTone(880, t, 0.05); 
        playTone(1760, t + 0.06, 0.08); 
      } catch (e) {}
    }

    const ADJ = ['Operator', 'Agent', 'Anomalous', 'Encrypted', 'Glitched', 'RedPill', 'BluePill', 'Cyber', 'Construct', 'Subroutine'];
    const ANI = ['Neo', 'Morpheus', 'Trinity', 'Oracle', 'Cypher', 'Smith', 'Keymaker', 'Niobe', 'Sentinel', 'Tank', 'Dozer'];
    const nameInput = document.getElementById('display-name');
    
    nameInput.value = localStorage.getItem('matrix_operator_name') || `${ADJ[Math.floor(Math.random()*ADJ.length)]}_${ANI[Math.floor(Math.random()*ANI.length)]}`;
    nameInput.addEventListener('change', () => {
      localStorage.setItem('matrix_operator_name', nameInput.value.trim());
      broadcast({ type: 'identity', name: nameInput.value.trim() });
    });

    const peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] } });

    peer.on('open', (id) => {
      myPeerId = id;
      const shareUrl = `${window.location.origin}${window.location.pathname}?id=${id}`;
      
      const shareBtn = document.getElementById('share-btn');
      const toggleQrBtn = document.getElementById('toggle-qr-btn');
      shareBtn.disabled = false; toggleQrBtn.disabled = false;
      
      shareBtn.onclick = async () => {
        if (navigator.share) { try { await navigator.share({ title: 'MatrixCom Signal', url: shareUrl }); } catch(e){} } 
        else if (navigator.clipboard) { navigator.clipboard.writeText(shareUrl); shareBtn.innerText = 'SIGNAL COPIED!'; setTimeout(() => shareBtn.innerText = 'COPY LINK', 2000); }
      };

      const qrCanvas = document.getElementById('qr-canvas');
      new QRious({ element: qrCanvas, value: shareUrl, size: 180 });
      
      toggleQrBtn.onclick = () => {
        const qrCont = document.getElementById('qr-container');
        if (qrCont.style.display === 'block') { qrCont.style.display = 'none'; toggleQrBtn.innerText = 'SHOW QR'; } 
        else { qrCont.style.display = 'block'; toggleQrBtn.innerText = 'HIDE QR'; }
      };

      updateUI();
      const targetId = new URLSearchParams(window.location.search).get('id');
      if (targetId) connectToPeer(targetId);
    });

    peer.on('connection', (conn) => setupConnection(conn));

    function connectToPeer(remoteId) {
      if (remoteId === myPeerId || connections.has(remoteId)) return;
      setupConnection(peer.connect(remoteId));
    }

    function setupConnection(conn) {
      conn.on('open', () => {
        connections.set(conn.peer, conn); updateUI();
        conn.send({ type: 'identity', name: nameInput.value.trim() });
      });
      conn.on('data', (data) => processData(data, conn.peer));
      const cleanup = () => {
        if (!connections.has(conn.peer)) return;
        const peerName = connections.get(conn.peer).name || conn.peer;
        connections.delete(conn.peer); updateUI(); logSystem(`Operator ${peerName} unplugged`);
      };
      conn.on('close', cleanup); conn.on('error', cleanup);
    }

    function broadcast(data) { connections.forEach(conn => { if (conn.open) conn.send(data); }); }

    function updateUI() {
      const active = connections.size > 0;
      document.getElementById('msg-input').disabled = !active;
      document.getElementById('send-btn').disabled = !active;
      
      document.getElementById('menu-file').disabled = !active;
      document.getElementById('menu-video').disabled = !active;
      document.getElementById('menu-screen').disabled = !active;
      
      if (myPeerId) {
        document.getElementById('conn-status').textContent = connections.size === 0 
          ? 'DISCONNECTED' 
          : `${connections.size} OPERATOR${connections.size === 1 ? '' : 'S'} PLUGGED IN`;
        
        const dot = document.getElementById('status-dot');
        dot.style.backgroundColor = connections.size === 0 ? '#ff3333' : '#00ff41';
        dot.style.boxShadow = `0 0 8px ${connections.size === 0 ? '#ff3333' : '#00ff41'}`;
      }
      if (active) { document.getElementById('qr-container').style.display = 'none'; document.getElementById('toggle-qr-btn').innerText = 'SHOW QR'; }
    }

    // --- Media Core Architecture ---
    let localStream = null;
    let screenStream = null;
    const videoContainer = document.getElementById('video-container');
    const localVidWrap = document.getElementById('local-vid-wrap');
    const localVideo = document.getElementById('local-video');
    const menuVidBtn = document.getElementById('menu-video');

    // UI Toggle (Theater Mode)
    document.getElementById('toggle-ui-btn').onclick = () => {
      document.body.classList.toggle('hide-ui');
      const btn = document.getElementById('toggle-ui-btn');
      if (document.body.classList.contains('hide-ui')) {
        btn.textContent = '✖️';
        btn.title = 'Show Terminal';
      } else {
        btn.textContent = '↕️';
        btn.title = 'Theater Mode';
      }
    };

    function stopAllMedia() {
      let stoppedSomething = false;

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
        stoppedSomething = true;
      }
      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
        stoppedSomething = true;
      }

      if (stoppedSomething) {
         broadcast({ type: 'media-stopped', id: myPeerId });
      }

      localVidWrap.style.display = 'none';
      document.getElementById('menu-video').textContent = '📹 Optical Feed';
      document.getElementById('menu-screen').textContent = '🖥️ Broadcast Terminal';

      const hasRemote = document.querySelectorAll('.remote-vid-wrap').length > 0;
      if (!hasRemote) {
        videoContainer.style.display = 'none';
        document.body.classList.remove('hide-ui');
        document.getElementById('toggle-ui-btn').textContent = '↕️';
      }
    }

    function processData(data, senderId) {
      const conn = connections.get(senderId);
      const senderName = conn?.name || senderId;

      if (typeof data === 'string') { playNotificationSound(); return logBubble(senderName, data, false); }
      if (data.type === 'identity') {
        if (conn && conn.name !== data.name) { conn.name = data.name; logSystem(`Operator ${data.name} jacked into the Construct`); }
        return;
      }
      if (data.type === 'media-stopped') {
        removeSpecificVideo(senderId);
        return;
      }
      if (data.type === 'file-header') { incomingTransfers.set(senderId, { name: data.name, type: data.filetype, chunks: [] }); } 
      else if (data.type === 'file-chunk') { incomingTransfers.get(senderId)?.chunks.push(data.chunk); } 
      else if (data.type === 'file-complete') {
        const transfer = incomingTransfers.get(senderId);
        if (transfer) {
          const blob = new Blob(transfer.chunks, { type: transfer.type });
          playNotificationSound(); logDownload(senderName, URL.createObjectURL(blob), transfer.name);
          incomingTransfers.delete(senderId);
        }
      }
    }

    const addBtn = document.getElementById('add-btn');
    const actionMenu = document.getElementById('action-menu');
    addBtn.onclick = (e) => {
      e.stopPropagation(); const isActive = actionMenu.classList.contains('active');
      actionMenu.classList.toggle('active', !isActive);
      addBtn.style.transform = !isActive ? 'rotate(45deg)' : 'rotate(0deg)'; addBtn.style.transition = 'transform 0.2s';
    };
    document.addEventListener('click', (e) => {
      if (!actionMenu.contains(e.target) && e.target !== addBtn) { actionMenu.classList.remove('active'); addBtn.style.transform = 'rotate(0deg)'; }
    });

    // Sound Toggle Action Menu Listener
    const menuSoundBtn = document.getElementById('menu-sound');
    menuSoundBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      menuSoundBtn.textContent = soundEnabled ? '🔊 Audio Chime: ON' : '🔇 Audio Chime: MUTED';
      actionMenu.classList.remove('active');
      addBtn.style.transform = 'rotate(0deg)';
      logSystem(soundEnabled ? "Audio chimes enabled" : "Audio chimes muted");
    };

    document.getElementById('btn-mute').onclick = () => {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        const btn = document.getElementById('btn-mute');
        btn.textContent = audioTrack.enabled ? '🎤' : '🔇'; btn.classList.toggle('muted', !audioTrack.enabled);
      }
    };

    async function getCameras() {
      try {
        let devices = await navigator.mediaDevices.enumerateDevices();
        let videoInputs = devices.filter(d => d.kind === 'videoinput');
        if (videoInputs.length > 0 && videoInputs[0].label === '') {
           const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
           devices = await navigator.mediaDevices.enumerateDevices();
           videoInputs = devices.filter(d => d.kind === 'videoinput');
           tempStream.getTracks().forEach(t => t.stop());
        }
        return videoInputs;
      } catch (err) { return []; }
    }

    async function openCamModal() {
      actionMenu.classList.remove('active'); addBtn.style.transform = 'rotate(0deg)';
      const list = document.getElementById('cam-list');
      list.innerHTML = '<div style="color:var(--subtext); text-align:center;">Scanning Matrix optical nodes...</div>';
      document.getElementById('cam-modal').style.display = 'flex';
      const cams = await getCameras(); list.innerHTML = '';
      if(cams.length === 0) { list.innerHTML = '<div style="color:#ff3333;text-align:center;">No optical hardware detected.</div>'; } 
      else { cams.forEach((cam, index) => { const btn = document.createElement('button'); btn.className = 'cam-btn'; btn.textContent = cam.label || `Optical Sensor Node ${index + 1}`; btn.onclick = () => startCamera(cam.deviceId); list.appendChild(btn); }); }
    }

    function closeCamModal() { document.getElementById('cam-modal').style.display = 'none'; }
    document.getElementById('btn-flip').onclick = openCamModal;

    async function startCamera(deviceId) {
      closeCamModal();
      try {
        const isSwitchingLenses = !!localStream;
        
        if (isSwitchingLenses) {
           const oldVideoTrack = localStream.getVideoTracks()[0];
           if (oldVideoTrack) oldVideoTrack.stop();
           const newStream = await navigator.mediaDevices.getUserMedia({ video: deviceId ? { deviceId: { exact: deviceId } } : true });
           const newVideoTrack = newStream.getVideoTracks()[0];
           
           Object.values(peer.connections).forEach(peerConns => {
             peerConns.forEach(conn => {
               if (conn.type === 'media' && conn.peerConnection) {
                 const senders = conn.peerConnection.getSenders();
                 const vidSender = senders.find(s => s.track && s.track.kind === 'video');
                 if (vidSender) vidSender.replaceTrack(newVideoTrack);
               }
             });
           });
           localStream.removeTrack(oldVideoTrack); localStream.addTrack(newVideoTrack);
           localVideo.srcObject = localStream;
        } else {
           stopAllMedia();
           const newStream = await navigator.mediaDevices.getUserMedia({ video: deviceId ? { deviceId: { exact: deviceId } } : true, audio: true });
           
           localStream = newStream;
           localVideo.srcObject = localStream;
           localVidWrap.style.display = 'block'; 
           videoContainer.style.display = 'flex';
           menuVidBtn.textContent = '⏹️ Terminate Feed';
           document.getElementById('btn-mute').textContent = '🎤'; document.getElementById('btn-mute').classList.remove('muted');

           logSystem("Streaming neural visual feed...");
           connections.forEach((conn) => {
             const call = peer.call(conn.peer, localStream);
             handleCallStream(call);
           });
        }
      } catch (err) { logSystem("Optical interface access denied."); }
    }

    menuVidBtn.onclick = () => {
      if (localStream) { stopAllMedia(); logSystem("Optical feed terminated."); actionMenu.classList.remove('active'); addBtn.style.transform = 'rotate(0deg)'; } 
      else { openCamModal(); }
    };

    peer.on('call', (call) => {
      const callerName = connections.get(call.peer)?.name || call.peer;
      logSystem(`Receiving visual feed from ${callerName}...`);
      playNotificationSound();
      call.answer(screenStream || localStream || undefined); 
      handleCallStream(call);
    });

    document.getElementById('menu-screen').onclick = async () => {
      actionMenu.classList.remove('active'); addBtn.style.transform = 'rotate(0deg)';
      
      if (screenStream) { stopAllMedia(); logSystem("Terminal broadcast offline."); return; }

      try {
        stopAllMedia(); 
        
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const displayOptions = isMobile ? { video: true } : { video: true, audio: true };

        screenStream = await navigator.mediaDevices.getDisplayMedia(displayOptions);
        document.getElementById('menu-screen').textContent = '⏹️ Stop Broadcast';
        videoContainer.style.display = 'flex';
        logSystem("Transmitting Construct display buffer...");
        
        screenStream.getVideoTracks()[0].onended = () => {
          stopAllMedia();
          logSystem("Terminal broadcast offline.");
        };

        connections.forEach((conn) => {
          const call = peer.call(conn.peer, screenStream);
          handleCallStream(call);
        });
      } catch (err) { logSystem("Terminal broadcast rejected."); }
    };

    function handleCallStream(call) {
      call.on('stream', (remoteStream) => {
        let wrap = document.getElementById(`wrap-${call.peer}`);
        let remoteVid = document.getElementById(`vid-${call.peer}`);

        if (wrap && remoteVid) {
          if (remoteVid.srcObject !== remoteStream) { remoteVid.srcObject = remoteStream; }
          return;
        }

        videoContainer.style.display = 'flex';
        wrap = document.createElement('div'); wrap.className = 'remote-vid-wrap'; wrap.id = `wrap-${call.peer}`;
        remoteVid = document.createElement('video'); remoteVid.id = `vid-${call.peer}`;
        remoteVid.srcObject = remoteStream; remoteVid.autoplay = true; remoteVid.playsInline = true;
        
        remoteVid.addEventListener('click', () => { remoteVid.classList.toggle('video-fullscreen'); });

        wrap.appendChild(remoteVid); videoContainer.appendChild(wrap);
      });

      call.on('close', () => removeSpecificVideo(call.peer));
      peer.on('connection', (conn) => conn.on('close', () => removeSpecificVideo(conn.peer)));
    }

    function removeSpecificVideo(peerId) {
      const wrap = document.getElementById(`wrap-${peerId}`);
      if (wrap) wrap.remove();
      
      const hasRemote = document.querySelectorAll('.remote-vid-wrap').length > 0;
      if (!hasRemote && !localStream && !screenStream) { 
        videoContainer.style.display = 'none'; 
        document.body.classList.remove('hide-ui');
      }
    }

    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const fileInput = document.getElementById('file-input');
    
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });
    msgInput.addEventListener('focus', () => setTimeout(scrollToBottom, 300));
    sendBtn.onclick = () => { const text = msgInput.value.trim(); if (text) { broadcast(text); logBubble('YOU', text, true); msgInput.value = ''; } };

    document.getElementById('menu-file').onclick = () => { actionMenu.classList.remove('active'); addBtn.style.transform = 'rotate(0deg)'; fileInput.click(); };

    fileInput.onchange = async () => {
      const file = fileInput.files[0]; if (!file) return;
      if (file.size > 250 * 1024 * 1024) return alert(`Data payload too large (${Math.round(file.size/1024/1024)}MB).`);
      
      fileInput.value = ''; logSystem(`Transmitting packet ${file.name}...`); broadcast({ type: 'file-header', name: file.name, filetype: file.type });

      let offset = 0;
      while (offset < file.size) {
        let maxBuffer = 0;
        connections.forEach(c => { if (c.dataChannel && c.dataChannel.bufferedAmount > maxBuffer) maxBuffer = c.dataChannel.bufferedAmount; });
        if (maxBuffer > 1024 * 1024) { await new Promise(r => setTimeout(r, 50)); continue; }
        const buffer = await file.slice(offset, offset + CHUNK_SIZE).arrayBuffer(); broadcast({ type: 'file-chunk', chunk: buffer }); offset += CHUNK_SIZE;
      }
      broadcast({ type: 'file-complete' }); logSystem(`Transmitted packet ${file.name}`);
    };

    function scrollToBottom() { const sb = document.querySelector('.scroll-body'); if (sb) sb.scrollTo({ top: sb.scrollHeight, behavior: 'smooth' }); }
    function escapeHTML(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function logBubble(sender, text, isOut) { const chat = document.getElementById('chat-box'); const div = document.createElement('div'); div.className = `bubble ${isOut ? 'bubble-out' : 'bubble-in'}`; div.innerHTML = `<div class="bubble-author">${escapeHTML(sender)}</div><div>${escapeHTML(text)}</div>`; chat.appendChild(div); scrollToBottom(); }
    function logSystem(text) { const chat = document.getElementById('chat-box'); const div = document.createElement('div'); div.className = 'system-pill'; div.textContent = text; chat.appendChild(div); scrollToBottom(); }
    function logDownload(sender, url, filename) { const chat = document.getElementById('chat-box'); const div = document.createElement('div'); div.className = 'bubble bubble-in'; div.innerHTML = `<div class="bubble-author">${escapeHTML(sender)}</div><a class="download-card" href="${url}" download="${escapeHTML(filename)}">⬇️ DOWNLOAD DATA PACKET: ${escapeHTML(filename).toUpperCase()}</a>`; div.querySelector('a').onclick = () => setTimeout(() => URL.revokeObjectURL(url), 10000); chat.appendChild(div); scrollToBottom(); }
  </script>
</body>
</html>
