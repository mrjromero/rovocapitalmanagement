<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MatrixSend</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      --matrix-green: #00ff41;
      --matrix-dim: #008f11;
      --matrix-dark: #003b00;
      --bg-black: #030a04;
      --card-bg: #051407;
      --border-green: #00551c;
      --alert-red: #ff0033;
      --text-main: #00ff41;
      --text-sub: #00a82d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Share Tech Mono', monospace;
      background-color: var(--bg-black);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
    }

    /* Subtle CRT Scanline overlay */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 100;
      pointer-events: none;
      opacity: 0.6;
    }

    .app-container {
      background: var(--bg-black);
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid var(--border-green);
      border-right: 1px solid var(--border-green);
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.05);
    }

    /* Header */
    .app-header {
      background: #000000;
      padding: 14px 16px;
      border-bottom: 2px solid var(--matrix-green);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
    }

    .app-title {
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--matrix-green);
    }

    .status-badge {
      font-size: 11px;
      color: #000;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--matrix-green);
      padding: 4px 10px;
      border-radius: 2px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 0 8px var(--matrix-green);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--alert-red);
      box-shadow: 0 0 6px var(--alert-red);
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    /* Main Scrollable Layout */
    .scroll-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-green);
      border-radius: 4px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.05);
    }

    .card-title {
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 1.5px;
      border-bottom: 1px solid var(--border-green);
      padding-bottom: 6px;
    }

    /* QR Container */
    #qr-card {
      text-align: center;
      align-items: center;
    }

    #qr-container {
      padding: 10px;
      background: #000;
      border: 1px solid var(--matrix-green);
      box-shadow: 0 0 12px rgba(0, 255, 65, 0.2);
      display: inline-block;
      margin: 8px 0;
    }

    #qr-canvas {
      display: block;
    }

    .qr-subtext {
      font-size: 11px;
      color: var(--text-sub);
      letter-spacing: 1px;
    }

    /* Buttons */
    .btn {
      height: 48px;
      padding: 0 16px;
      background-color: transparent;
      color: var(--matrix-green);
      border: 1px solid var(--matrix-green);
      border-radius: 4px;
      font-size: 15px;
      font-weight: bold;
      font-family: 'Share Tech Mono', monospace;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1.5px;
      transition: all 0.2s ease;
      text-shadow: 0 0 5px var(--matrix-green);
    }

    .btn:hover:not(:disabled) {
      background-color: var(--matrix-green);
      color: #000;
      box-shadow: 0 0 15px var(--matrix-green);
      text-shadow: none;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      border-color: var(--matrix-dark);
      color: var(--matrix-dark);
      text-shadow: none;
      cursor: not-allowed;
    }

    .btn-secondary {
      height: 36px;
      font-size: 12px;
      width: 100%;
      margin-top: 4px;
    }

    .btn-main {
      width: 100%;
      height: 56px;
      font-size: 16px;
    }

    /* Status Window / Terminal Log */
    .terminal-card {
      flex: 1;
      min-height: 200px;
      display: flex;
      flex-direction: column;
    }

    .terminal-log {
      flex: 1;
      background: #000;
      border: 1px solid var(--border-green);
      border-radius: 2px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.6;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 250px;
    }

    .log-entry {
      word-break: break-word;
    }

    .log-entry.info { color: var(--text-main); }
    .log-entry.success { color: var(--matrix-green); font-weight: bold; }
    .log-entry.alert { color: var(--alert-red); }
    
    .download-link {
      display: inline-block;
      margin-top: 4px;
      padding: 6px 12px;
      color: #000;
      background: var(--matrix-green);
      text-decoration: none;
      font-weight: bold;
      border-radius: 2px;
      box-shadow: 0 0 8px var(--matrix-green);
    }

    .download-link:hover {
      background: #fff;
      box-shadow: 0 0 12px #fff;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="app-title">&gt; MATRIXSEND_</div>
      <div class="status-badge">
        <div id="status-dot" class="status-dot"></div>
        <span id="conn-status">OFFLINE</span>
      </div>
    </header>

    <div class="scroll-body">
      <!-- QR Code Section -->
      <div class="card" id="qr-card">
        <div class="card-title">&gt; ACCESS_NODE_QR</div>
        <div id="qr-container">
          <canvas id="qr-canvas"></canvas>
        </div>
        <div class="qr-subtext">SCAN TO ESTABLISH PEER LINK</div>
        <button id="copy-btn" class="btn btn-secondary" disabled>COPY LINK LOCATION</button>
      </div>

      <!-- Action Section -->
      <div class="card">
        <div class="card-title">&gt; DATA_TRANSMISSION</div>
        <input type="file" id="file-input" hidden>
        <button id="send-file-btn" class="btn btn-main" disabled>&gt; TRANSMIT FILE &lt;</button>
      </div>

      <!-- Status Window -->
      <div class="card terminal-card">
        <div class="card-title">&gt; SYSTEM_LOG_OUTPUT</div>
        <div id="status-window" class="terminal-log">
          <div class="log-entry info">[INITIALIZING SYSTEM...]</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CHUNK_SIZE = 16384;
    let myPeerId = null;
    const connections = new Map();
    const incomingTransfers = new Map();

    // DOM Elements
    const statusDot = document.getElementById('status-dot');
    const connStatus = document.getElementById('conn-status');
    const qrCanvas = document.getElementById('qr-canvas');
    const copyBtn = document.getElementById('copy-btn');
    const sendFileBtn = document.getElementById('send-file-btn');
    const fileInput = document.getElementById('file-input');
    const statusWindow = document.getElementById('status-window');

    function logStatus(text, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const time = new Date().toLocaleTimeString([], { hour12: false });
      entry.textContent = `[${time}] ${text}`;
      statusWindow.appendChild(entry);
      statusWindow.scrollTop = statusWindow.scrollHeight;
    }

    function logDownloadLink(url, filename) {
      const entry = document.createElement('div');
      entry.className = 'log-entry success';
      const time = new Date().toLocaleTimeString([], { hour12: false });
      entry.innerHTML = `[${time}] INCOMING FILE RECEIVED:<br>` +
                        `<a href="${url}" download="${escapeHTML(filename)}" class="download-link">&gt; DOWNLOAD ${escapeHTML(filename).toUpperCase()} &lt;</a>`;
      statusWindow.appendChild(entry);
      statusWindow.scrollTop = statusWindow.scrollHeight;
    }

    function escapeHTML(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // PeerJS Initialization
    const peer = new Peer({
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });

    peer.on('open', (id) => {
      myPeerId = id;
      const shareUrl = `${window.location.origin}${window.location.pathname}?id=${id}`;
      
      // Matrix-style QR Code (Bright green on black canvas)
      new QRious({
        element: qrCanvas,
        value: shareUrl,
        size: 180,
        background: '#000000',
        foreground: '#00ff41'
      });

      copyBtn.disabled = false;
      copyBtn.onclick = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(shareUrl);
          copyBtn.textContent = 'LINK COPIED TO BUFFER!';
          setTimeout(() => copyBtn.textContent = 'COPY LINK LOCATION', 2000);
        }
      };

      logStatus(`NODE INITIALIZED. ID: ${id.substring(0, 8)}...`, 'success');
      
      // Auto-connect if target ID is present in URL
      const targetId = new URLSearchParams(window.location.search).get('id');
      if (targetId) {
        logStatus(`CONNECTING TO TARGET NODE [${targetId.substring(0, 8)}]...`);
        connectToPeer(targetId);
      }
    });

    peer.on('connection', (conn) => setupConnection(conn));

    function connectToPeer(remoteId) {
      if (remoteId === myPeerId || connections.has(remoteId)) return;
      setupConnection(peer.connect(remoteId));
    }

    function setupConnection(conn) {
      conn.on('open', () => {
        connections.set(conn.peer, conn);
        updateUI();
        logStatus(`LINK ESTABLISHED WITH PEER [${conn.peer.substring(0, 8)}]`, 'success');
      });

      conn.on('data', (data) => processData(data, conn.peer));

      const cleanup = () => {
        if (!connections.has(conn.peer)) return;
        connections.delete(conn.peer);
        updateUI();
        logStatus(`LINK TERMINATED [${conn.peer.substring(0, 8)}]`, 'alert');
      };

      conn.on('close', cleanup);
      conn.on('error', cleanup);
    }

    function broadcast(data) {
      connections.forEach(conn => {
        if (conn.open) conn.send(data);
      });
    }

    function updateUI() {
      const active = connections.size > 0;
      sendFileBtn.disabled = !active;
      
      if (myPeerId) {
        connStatus.textContent = active ? `${connections.size} NODE(S) ONLINE` : 'OFFLINE';
        statusDot.style.backgroundColor = active ? 'var(--matrix-green)' : 'var(--alert-red)';
        statusDot.style.boxShadow = active ? '0 0 8px var(--matrix-green)' : '0 0 8px var(--alert-red)';
      }
    }

    function processData(data, senderId) {
      if (data.type === 'file-header') {
        incomingTransfers.set(senderId, { name: data.name, type: data.filetype, chunks: [] });
        logStatus(`RECEIVING STREAM: ${data.name}...`);
      } else if (data.type === 'file-chunk') {
        incomingTransfers.get(senderId)?.chunks.push(data.chunk);
      } else if (data.type === 'file-complete') {
        const transfer = incomingTransfers.get(senderId);
        if (transfer) {
          const blob = new Blob(transfer.chunks, { type: transfer.type });
          logDownloadLink(URL.createObjectURL(blob), transfer.name);
          incomingTransfers.delete(senderId);
        }
      }
    }

    // Send File Execution
    sendFileBtn.onclick = () => fileInput.click();

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;
      if (file.size > 250 * 1024 * 1024) {
        logStatus(`ERROR: FILE SIZE EXCEEDS 250MB LIMIT`, 'alert');
        return;
      }

      fileInput.value = '';
      logStatus(`TRANSMITTING ${file.name} (${Math.round(file.size / 1024)} KB)...`);
      broadcast({ type: 'file-header', name: file.name, filetype: file.type });

      let offset = 0;
      while (offset < file.size) {
        let maxBuffer = 0;
        connections.forEach(c => {
          if (c.dataChannel && c.dataChannel.bufferedAmount > maxBuffer) {
            maxBuffer = c.dataChannel.bufferedAmount;
          }
        });
        if (maxBuffer > 1024 * 1024) {
          await new Promise(r => setTimeout(r, 50));
          continue;
        }
        const buffer = await file.slice(offset, offset + CHUNK_SIZE).arrayBuffer();
        broadcast({ type: 'file-chunk', chunk: buffer });
        offset += CHUNK_SIZE;
      }
      broadcast({ type: 'file-complete' });
      logStatus(`TRANSMISSION COMPLETE: ${file.name}`, 'success');
    };
  </script>
</body>
</html>
