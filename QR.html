<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <!-- Load qrcode.js via CDN for high compatibility -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #1f2937;
        }
        p {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        button {
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 0.5rem;
            transition: background-color 0.2s;
        }
        #generate-btn {
            background-color: #3b82f6;
        }
        #generate-btn:hover {
            background-color: #2563eb;
        }
        #download-btn {
            background-color: #10b981;
            display: none; /* Hidden until QR is generated */
        }
        #download-btn:hover {
            background-color: #059669;
        }
        #qrcode-container {
            margin: 1.5rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 256px;
            background-color: #f9fafb;
            border-radius: 8px;
            border: 1px dashed #d1d5db;
        }
        #qrcode-container img, 
        #qrcode-container canvas {
            max-width: 100%;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>QR Code Generator</h2>
        <p>Enter a URL or text to generate a downloadable QR code.</p>
        
        <input type="text" id="text-input" placeholder="e.g., https://example.com" autocomplete="off">
        
        <button id="generate-btn" onclick="generateQR()">Generate QR Code</button>
        
        <div id="qrcode-container">
            <!-- QR Code will be injected here -->
            <span id="placeholder-text" style="color: #9ca3af;">Preview</span>
        </div>
        
        <button id="download-btn" onclick="downloadQR()">Download PNG</button>
    </div>

    <script>
        const qrContainer = document.getElementById('qrcode-container');
        const input = document.getElementById('text-input');
        const downloadBtn = document.getElementById('download-btn');
        const placeholder = document.getElementById('placeholder-text');

        // Allow generating by pressing "Enter"
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                generateQR();
            }
        });

        function generateQR() {
            const text = input.value.trim();
            if (!text) {
                alert("Please enter some text or a URL.");
                return;
            }

            // Clear previous QR code and placeholder
            qrContainer.innerHTML = "";

            // Generate new QR Code
            new QRCode(qrContainer, {
                text: text,
                width: 256,
                height: 256,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H // High error correction (30%)
            });

            // Remove dashed border once generated and show download button
            qrContainer.style.border = "none";
            
            // Short timeout to ensure canvas/img is rendered in the DOM before displaying button
            setTimeout(() => {
                downloadBtn.style.display = "block";
            }, 100);
        }

        function downloadQR() {
            // qrcode.js generates a <canvas> element first, and sometimes converts it to an <img>
            const canvas = qrContainer.querySelector('canvas');
            const img = qrContainer.querySelector('img');
            let dataUrl = "";

            if (canvas) {
                dataUrl = canvas.toDataURL("image/png");
            } else if (img && img.src) {
                dataUrl = img.src;
            }

            if (dataUrl) {
                // Create a temporary anchor element to trigger the download
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = 'qrcode.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                alert("QR Code not ready yet. Please try again.");
            }
        }
    </script>
</body>
</html>
