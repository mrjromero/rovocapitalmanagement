<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendee Departure Information</title>
    
    <!-- SheetJS for processing the Excel File -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <!-- html2pdf for rendering the PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 30px 20px; 
            background: #f4f7f6; 
            color: #333; 
        }
        .card { 
            background: #fff; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.05); 
            margin-bottom: 25px; 
        }
        h2, h3 { color: #2c3e50; margin-top: 0; }
        
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ced4da; 
            border-radius: 5px; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        input[type="file"] { margin-top: 10px; }
        
        button { 
            background: #0056b3; 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background: #004494; }
        
        .name-select-btn { 
            background: #e9ecef; 
            color: #333; 
            border: 1px solid #ced4da; 
            margin: 5px 5px 5px 0; 
        }
        .name-select-btn:hover { background: #dde2e6; }
        .name-select-btn.active { 
            background: #28a745; 
            color: white; 
            border-color: #28a745; 
        }
        
        .hidden { display: none !important; }
        
        /* Responsive Table Wrapper */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 25px;
            border-radius: 4px;
        }
        
        .data-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
            min-width: 450px; /* Prevents squishing on very narrow screens */
        }
        .data-table th, .data-table td { 
            padding: 12px 10px; 
            border: 1px solid #e0e0e0; 
            text-align: left; 
        }
        .data-table th { background: #f8f9fa; width: 35%; font-weight: 600;}
        .data-table tr:nth-child(even) { background-color: #fafafa; }
        
        .header-actions { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .error-text { color: #dc3545; font-size: 0.9em; margin-bottom: 5px; }
        
        #printable-area { padding: 15px; }

        /* Styling for the new Notice Card */
        .narrative-card {
            background: #e1f5fe;
            border-left: 6px solid #0288d1;
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 25px;
            color: #01579b;
        }
        .narrative-card h3 { 
            color: #0277bd; 
            margin-top: 0; 
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        .narrative-card p {
            margin: 8px 0;
            font-size: 1.05em;
        }
        .highlight-time {
            font-size: 1.25em;
            font-weight: 700;
            color: #d32f2f;
            background: #ffffff;
            padding: 3px 10px;
            border-radius: 4px;
            border: 1px solid #ffcdd2;
            display: inline-block;
        }
        
        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            body { padding: 15px 10px; }
            .card { padding: 15px; }
            .data-table th, .data-table td { padding: 8px; font-size: 0.9em; }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Attendee Departure Search</h2>
    <p>Search for your name to retrieve your departure information and hotel departure schedule.</p>
    
    <!-- Fallback if the browser blocks automatic fetching of the local Excel file -->
    <div id="file-upload-section" class="hidden">
        <p class="error-text"><strong>Notice:</strong> Browser security prevented auto-loading. Please select the file manually.</p>
        <label for="excel-file">Select <strong>departures.xlsx</strong>:</label><br>
        <input type="file" id="excel-file" accept=".xlsx, .xls">
    </div>

    <!-- Main Search UI -->
    <div id="search-section" class="hidden">
        <input type="text" id="search-input" placeholder="Type your name to search...">
        <div id="search-results"></div>
    </div>
</div>

<div id="export-section" class="hidden card">
    <div class="header-actions">
        <button onclick="copyToClipboard()">📋 Copy to Clipboard</button>
        <button onclick="downloadPDF()">📄 Download as PDF</button>
    </div>
    
    <!-- Data rendered here for both on-screen viewing and PDF export -->
    <div id="printable-area"></div>
</div>

<script>
    const targetFileName = "departures.xlsx";
    
    let timelineHtml = "";
    let timelineDataRaw = []; // Holds the raw timeline array for the matching logic
    let attendeesData = [];
    let currentDisplayedData = ""; // Used to hold plain-text for the clipboard

    // 1. Attempt to auto-fetch the file on load
    window.onload = async () => {
        try {
            const response = await fetch(targetFileName);
            if (!response.ok) throw new Error("Fetch failed");
            const arrayBuffer = await response.arrayBuffer();
            processExcel(arrayBuffer);
        } catch (e) {
            console.warn("Could not auto-fetch " + targetFileName + ". Showing file input fallback.");
            document.getElementById('file-upload-section').classList.remove('hidden');
        }
    };

    // 2. Handle manual file selection
    document.getElementById('excel-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => processExcel(evt.target.result);
        reader.readAsArrayBuffer(file);
    });

    // 3. Process and parse the Excel file
    function processExcel(data) {
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetNames = workbook.SheetNames;
        
        if (sheetNames.length === 0) return alert("Excel file is empty.");

        // Tab 1: Extract General Timeline
        const timelineSheet = workbook.Sheets[sheetNames[0]];
        timelineDataRaw = XLSX.utils.sheet_to_json(timelineSheet, { header: 1, raw: false });
        
        // Changed title and added table-responsive wrapper
        timelineHtml = `<h3>Hotel Departure Schedule</h3><div class="table-responsive"><table class='data-table'>`;
        timelineDataRaw.forEach(row => {
            if (row.length > 0) {
                timelineHtml += "<tr>";
                row.forEach(cell => {
                    timelineHtml += `<td>${cell !== undefined ? cell : ''}</td>`;
                });
                timelineHtml += "</tr>";
            }
        });
        timelineHtml += "</table></div>";

        // Subsequent Tabs: Extract Attendee Particulars
        attendeesData = [];
        for (let i = 1; i < sheetNames.length; i++) {
            const sheet = workbook.Sheets[sheetNames[i]];
            const sheetData = XLSX.utils.sheet_to_json(sheet, { raw: false });
            sheetData.forEach(row => {
                attendeesData.push({ sheetName: sheetNames[i], data: row });
            });
        }

        document.getElementById('file-upload-section').classList.add('hidden');
        document.getElementById('search-section').classList.remove('hidden');
    }

    // 4. Handle Search Input
    document.getElementById('search-input').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const resultsContainer = document.getElementById('search-results');
        
        resultsContainer.innerHTML = "";
        document.getElementById('export-section').classList.add('hidden');
        
        if (query.length < 2) return; 

        const matches = attendeesData.filter(att => 
            Object.values(att.data).some(val => String(val).toLowerCase().includes(query))
        );

        if (matches.length === 0) {
            resultsContainer.innerHTML = "<p>No matches found.</p>";
            return;
        }

        matches.forEach((match, index) => {
            let nameLabel = "Record Match " + (index + 1);
            for (const [key, value] of Object.entries(match.data)) {
                if (key.toLowerCase().includes('name') || key.toLowerCase().includes('nombres')) {
                    nameLabel = value;
                    break;
                }
            }
            
            const btn = document.createElement('button');
            btn.className = "name-select-btn";
            btn.textContent = nameLabel;
            btn.onclick = (event) => displayData(match, event);
            resultsContainer.appendChild(btn);
        });
    });

    // 5. Smart Time Matcher - Helpers
    function parseSingleTime(timeStr) {
        if (!timeStr) return null;
        let str = String(timeStr).trim().toLowerCase().replace(/\./g, '');
        str = str.replace(/12:00\s*m/, '12:00 pm');
        
        let match = str.match(/(\d+):(\d+)\s*(am|pm)/);
        if (!match) return null;
        
        let h = parseInt(match[1], 10);
        let m = parseInt(match[2], 10);
        let p = match[3];
        
        return (p === 'pm' && h !== 12 ? h + 12 : (p === 'am' && h === 12 ? 0 : h)) * 60 + m;
    }

    function parseTimeRange(rangeStr) {
        let parts = rangeStr.split('-');
        if (parts.length !== 2) return null;
        
        let startStr = parts[0].trim().toLowerCase().replace(/\./g, '');
        let endStr = parts[1].trim().toLowerCase().replace(/\./g, '');
        
        startStr = startStr.replace(/12:00\s*m/, '12:00 pm');
        endStr = endStr.replace(/12:00\s*m/, '12:00 pm');
        
        let startMatch = startStr.match(/(\d+):(\d+)\s*(am|pm)?/);
        let endMatch = endStr.match(/(\d+):(\d+)\s*(am|pm)?/);
        
        if (!startMatch || !endMatch) return null;
        
        let startH = parseInt(startMatch[1], 10);
        let startM = parseInt(startMatch[2], 10);
        let startP = startMatch[3];
        
        let endH = parseInt(endMatch[1], 10);
        let endM = parseInt(endMatch[2], 10);
        let endP = endMatch[3];
        
        if (!endP) {
            if (endH === 12) endP = 'pm'; else endP = startP || 'am';
        }
        if (!startP) {
            if (startH === 12) startP = 'pm'; else startP = endP || 'am';
        }
        
        let start = (startP === 'pm' && startH !== 12 ? startH + 12 : (startP === 'am' && startH === 12 ? 0 : startH)) * 60 + startM;
        let end = (endP === 'pm' && endH !== 12 ? endH + 12 : (endP === 'am' && endH === 12 ? 0 : endH)) * 60 + endM;
        
        // Auto-correct AM/PM typoes spanning past noon/midnight
        if (end < start && end + 12 * 60 >= start) end += 12 * 60;
        
        return { start, end };
    }

    function findDepartureInfo(attDate, attTime) {
        if (!attDate || !attTime) return null;
        
        const flightTime = parseSingleTime(attTime);
        if (flightTime === null) return null;
        
        let numbers = [];
        let words = [];
        String(attDate).toLowerCase().split(/[-/\s,]+/).forEach(p => {
            if (!isNaN(p) && p.trim() !== '') numbers.push(p);
            else if (p.length >= 3) words.push(p.substring(0, 3));
        });
        
        let currentDateContext = "";
        
        for (let i = 0; i < timelineDataRaw.length; i++) {
            const row = timelineDataRaw[i];
            
            if (row.length > 0) {
                const cell0 = String(row[0]).trim();
                const cell1 = row[1] !== undefined ? String(row[1]).trim() : "";
                
                // Track the date groupings
                if ((row.length === 1 || cell1 === "") && cell0 !== "" && !cell0.toLowerCase().includes('flight')) {
                    currentDateContext = cell0.toLowerCase();
                    continue;
                }
                
                if (row.length >= 2) {
                    const rangeStr = String(row[0]);
                    const depTimeStr = String(row[1]);
                    
                    if (rangeStr.toLowerCase().includes("flight") || rangeStr.toLowerCase().includes("departure")) continue;
                    
                    // Validate Date Match
                    let dateMatch = true;
                    if (words.length > 0 && !currentDateContext.includes(words[0])) dateMatch = false;
                    if (numbers.length > 0 && !numbers.some(n => currentDateContext.includes(n))) dateMatch = false;
                    if (!dateMatch) continue;
                    
                    // Validate Time Match
                    const range = parseTimeRange(rangeStr);
                    if (range && flightTime >= range.start && flightTime <= range.end) {
                        return depTimeStr;
                    }
                }
            }
        }
        return null;
    }

    // 6. Display Data & Build Narrative
    function displayData(match, event) {
        document.querySelectorAll('.name-select-btn').forEach(b => b.classList.remove('active'));
        if (event) event.target.classList.add('active');

        let attDate = "";
        let attTime = "";
        
        // Use table-responsive here as well for consistency
        let tableHtml = `<h3>Attendee Particulars (Tab: ${match.sheetName})</h3><div class="table-responsive"><table class="data-table">`;
        let textForClipboard = ``;
        
        for (const [key, value] of Object.entries(match.data)) {
            tableHtml += `<tr><th>${key}</th><td>${value}</td></tr>`;
            if (key.toUpperCase().includes('DATE')) attDate = value;
            if (key.toUpperCase().includes('TIME')) attTime = value;
        }
        tableHtml += `</table></div>`;
        
        // Build Narrative Card
        const exactDepartureTime = findDepartureInfo(attDate, attTime);
        let narrativeHtml = `<div class="narrative-card">
            <h3>🚐 Hotel Departure Notice</h3>`;
            
        if (exactDepartureTime) {
            narrativeHtml += `<p>Based on your flight scheduled for <strong>${attTime}</strong> on <strong>${attDate}</strong>:</p>
            <p>Please meet transportation in the hotel lobby at <span class="highlight-time">${exactDepartureTime}</span>.</p>`;
            
            textForClipboard += `--- 🚐 HOTEL DEPARTURE NOTICE ---\n`;
            textForClipboard += `Flight: ${attDate} at ${attTime}\n`;
            textForClipboard += `TRANSPORTATION MEETS IN LOBBY AT: ${exactDepartureTime}\n\n`;
        } else {
            narrativeHtml += `<p>Your flight is scheduled for <strong>${attTime || "Unknown"}</strong> on <strong>${attDate || "Unknown"}</strong>.</p>
            <p>Please check the Hotel Departure Schedule below to find your specific hotel departure time.</p>`;
        }
        narrativeHtml += `</div>`;

        // Assemble text for clipboard
        textForClipboard += `--- Attendee Particulars ---\n`;
        for (const [key, value] of Object.entries(match.data)) {
            textForClipboard += `${key}: ${value}\n`;
        }

        // Add Timeline to HTML
        let fullHtml = narrativeHtml + tableHtml;
        fullHtml += `<hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">`;
        fullHtml += timelineHtml;

        // Add Timeline to text clipboard
        let timelineText = "\n--- Hotel Departure Schedule ---\n";
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = timelineHtml;
        const table = tempDiv.querySelector('table');
        if (table) {
            for (let row of table.rows) {
                let rowData = [];
                for (let cell of row.cells) rowData.push(cell.innerText.trim());
                timelineText += rowData.join(" | ") + "\n";
            }
        }
        
        currentDisplayedData = textForClipboard + timelineText;
        document.getElementById('printable-area').innerHTML = fullHtml;
        document.getElementById('export-section').classList.remove('hidden');
    }

    // 7. Copy to Clipboard Functionality
    function copyToClipboard() {
        navigator.clipboard.writeText(currentDisplayedData).then(() => {
            alert("Departure data copied to clipboard!");
        }).catch(err => {
            alert("Failed to copy data. Your browser might block this action.");
        });
    }

    // 8. Download PDF Functionality
    function downloadPDF() {
        const element = document.getElementById('printable-area');
        const opt = {
            margin:       0.5,
            filename:     'Departure_Information.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 }, // Scale to improve table resolution
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>

</body>
</html>
