<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Local WebGPU Chat</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --user-msg: #007aff;
      --ai-msg: #e9e9eb;
      --text-main: #000000;
      --text-muted: #8e8e93;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); display: flex; justify-content: center; height: 100vh; width: 100vw; overflow: hidden; }

    /* Mobile Container Wrapper */
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    /* Top Bar Header */
    header {
      padding: 1rem;
      border-bottom: 1px solid #e5e5e5;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
    }
    header h1 { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
    
    /* Model Progress Section */
    .status-box {
      margin-top: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      align-items: center;
    }
    .status-text { font-size: 0.75rem; color: var(--text-muted); }
    progress { width: 80%; height: 6px; border-radius: 3px; overflow: hidden; appearance: none; }
    progress::-webkit-progress-bar { background-color: #e5e5e5; }
    progress::-webkit-progress-value { background-color: var(--user-msg); transition: width 0.2s ease; }

    /* Chat Area */
    .chat-history {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    
    .message {
      max-width: 80%;
      padding: 0.6rem 1rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background-color: var(--ai-msg);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    /* Controls & Input Area */
    .input-container {
      padding: 0.75rem 1rem;
      border-top: 1px solid #e5e5e5;
      background: white;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .load-btn {
      width: 100%;
      padding: 0.6rem;
      background: #34c759;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .load-btn:disabled { background: #d1d1d6; cursor: not-allowed; }

    .message-form { display: flex; gap: 0.5rem; }
    .message-form input {
      flex: 1;
      padding: 0.6rem 1rem;
      border: 1px solid #d1d1d6;
      border-radius: 20px;
      outline: none;
      font-size: 0.95rem;
    }
    .message-form button {
      background: var(--user-msg);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }
    .message-form button:disabled { background: #d1d1d6; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Local AI Assistant</h1>
      <div class="status-box">
        <span id="status-text" class="status-text">Engine Standby</span>
        <progress id="download-progress" value="0" max="100" style="display: none;"></progress>
      </div>
    </header>

    <div id="chat-history" class="chat-history">
      <div class="message assistant">Hello! Click "Initialize WebGPU Engine" below to download the lightweight model directly into your browser's persistent cache.</div>
    </div>

    <div class="input-container">
      <button id="load-btn" class="load-btn" onclick="initModel()">Initialize WebGPU Engine</button>
      
      <form class="message-form" onsubmit="handleSend(event)">
        <input type="text" id="user-input" placeholder="Type a message..." disabled autocomplete="off" />
        <button type="submit" id="send-btn" disabled>Send</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    // Switched from f16 to f32 precision to resolve ShaderF16SupportError
    const selectedModel = "TinyLlama-1.1B-Chat-v1.0-q4f32_1-MLC";
    let engine;
    const chatHistoryElement = document.getElementById("chat-history");

    function appendMessage(role, text) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", role);
      msgDiv.innerText = text;
      chatHistoryElement.appendChild(msgDiv);
      chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
      return msgDiv;
    }

    window.initModel = async () => {
      const loadBtn = document.getElementById("load-btn");
      const statusText = document.getElementById("status-text");
      const progressBar = document.getElementById("download-progress");

      loadBtn.disabled = true;
      progressBar.style.display = "block";

      try {
        engine = await CreateMLCEngine(
          selectedModel,
          {
            initProgressCallback: (report) => {
              // The WebLLM progress object returns a float between 0 and 1
              if (report.progress !== undefined) {
                const percent = Math.round(report.progress * 100);
                progressBar.value = percent;
                statusText.innerText = `Caching Tensors: ${percent}%`;
              } else {
                statusText.innerText = report.text;
              }
            }
          }
        );

        statusText.innerText = "Model Ready (WebGPU)";
        progressBar.style.display = "none";
        loadBtn.style.display = "none";
        
        document.getElementById("user-input").disabled = false;
        document.getElementById("send-btn").disabled = false;
        appendMessage("assistant", "Hardware acceleration initialized successfully! Data will not leave your browser. How can I help you?");
      } catch (err) {
        statusText.innerText = "Failed to load model. Check console for details.";
        console.error("WebGPU Initialization Error:", err);
        loadBtn.disabled = false;
        progressBar.style.display = "none";
      }
    };

    window.handleSend = async (e) => {
      e.preventDefault();
      const input = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const prompt = input.value.trim();

      if (!prompt) return;

      appendMessage("user", prompt);
      input.value = "";
      input.disabled = true;
      sendBtn.disabled = true;

      // Create placeholder element for stream response
      const aiResponseElement = appendMessage("assistant", "...");
      
      try {
        const messages = [{ role: "user", content: prompt }];
        const chunks = await engine.chat.completions.create({ messages, stream: true });
        
        let fullResponse = "";
        for await (const chunk of chunks) {
          const content = chunk.choices[0]?.delta?.content || "";
          fullResponse += content;
          aiResponseElement.innerText = fullResponse;
          chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
        }
      } catch (err) {
        aiResponseElement.innerText = "Error generating response.";
        console.error("Inference error:", err);
      }

      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    };
  </script>
</body>
</html>
