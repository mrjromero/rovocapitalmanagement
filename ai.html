<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Local WebAssembly Chat</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --user-msg: #007aff;
      --ai-msg: #e9e9eb;
      --text-main: #000000;
      --text-muted: #8e8e93;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); display: flex; justify-content: center; height: 100vh; width: 100vw; overflow: hidden; }

    /* Mobile Container Wrapper */
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    /* Top Bar Header */
    header {
      padding: 1rem;
      border-bottom: 1px solid #e5e5e5;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
    }
    header h1 { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
    
    /* Model Progress Section */
    .status-box {
      margin-top: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      align-items: center;
    }
    .status-text { font-size: 0.75rem; color: var(--text-muted); }
    progress { width: 80%; height: 6px; border-radius: 3px; overflow: hidden; appearance: none; }
    progress::-webkit-progress-bar { background-color: #e5e5e5; }
    progress::-webkit-progress-value { background-color: var(--user-msg); transition: width 0.2s ease; }

    /* Chat Area */
    .chat-history {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    
    .message {
      max-width: 80%;
      padding: 0.6rem 1rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background-color: var(--ai-msg);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    /* Controls & Input Area */
    .input-container {
      padding: 0.75rem 1rem;
      border-top: 1px solid #e5e5e5;
      background: white;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .load-btn {
      width: 100%;
      padding: 0.6rem;
      background: #34c759;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .load-btn:disabled { background: #d1d1d6; cursor: not-allowed; }

    .message-form { display: flex; gap: 0.5rem; }
    .message-form input {
      flex: 1;
      padding: 0.6rem 1rem;
      border: 1px solid #d1d1d6;
      border-radius: 20px;
      outline: none;
      font-size: 0.95rem;
    }
    .message-form button {
      background: var(--user-msg);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }
    .message-form button:disabled { background: #d1d1d6; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Local AI Assistant</h1>
      <div class="status-box">
        <span id="status-text" class="status-text">Awaiting .gguf file</span>
        <progress id="download-progress" value="0" max="100" style="display: none;"></progress>
      </div>
    </header>

    <div id="chat-history" class="chat-history">
      <div class="message assistant">Hello! Click "Select Local Model" to choose a .gguf file directly from your device storage.</div>
    </div>

    <div class="input-container">
      <!-- Hidden file input triggered by the button -->
      <input type="file" id="model-file-input" accept=".gguf" style="display: none;" onchange="handleFileSelect(event)" />
      
      <button id="load-btn" class="load-btn" onclick="document.getElementById('model-file-input').click()">Select Local Model (.gguf)</button>
      
      <form class="message-form" onsubmit="handleSend(event)">
        <input type="text" id="user-input" placeholder="Type a message..." disabled autocomplete="off" />
        <button type="submit" id="send-btn" disabled>Send</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { Wllama } from "https://unpkg.com/@wllama/wllama/esm/index.js";

    let engine;
    const chatHistoryElement = document.getElementById("chat-history");

    function appendMessage(role, text) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", role);
      msgDiv.innerText = text;
      chatHistoryElement.appendChild(msgDiv);
      chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
      return msgDiv;
    }

    // Handles the file selection from the user's device
    window.handleFileSelect = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const loadBtn = document.getElementById("load-btn");
      const statusText = document.getElementById("status-text");
      const progressBar = document.getElementById("download-progress");

      loadBtn.style.display = "none";
      progressBar.style.display = "block";
      progressBar.removeAttribute("value"); // Indeterminate progress while reading to RAM
      statusText.innerText = `Reading ${file.name} into memory...`;

      try {
        // 1. Read the local file into an ArrayBuffer
        const buffer = await file.arrayBuffer();

        // 2. Initialize the Wllama WASM execution environment
        statusText.innerText = "Initializing Wllama Engine...";
        engine = new Wllama({
          "single-thread/wllama.wasm": "https://unpkg.com/@wllama/wllama/esm/single-thread/wllama.wasm",
          "multi-thread/wllama.wasm": "https://unpkg.com/@wllama/wllama/esm/multi-thread/wllama.wasm"
        });

        // 3. Load the raw buffer into the engine
        statusText.innerText = "Loading model tensors...";
        await engine.loadModel(new Uint8Array(buffer));

        // Update UI state on success
        statusText.innerText = "Model Ready (WebAssembly)";
        progressBar.style.display = "none";
        document.getElementById("user-input").disabled = false;
        document.getElementById("send-btn").disabled = false;
        
        appendMessage("assistant", `Successfully loaded ${file.name} from your device! How can I help you?`);
      } catch (err) {
        statusText.innerText = "Error loading model. Check console for details.";
        console.error("Initialization error:", err);
        loadBtn.style.display = "block";
        progressBar.style.display = "none";
      }
    };

    // Handles the chat generation logic
    window.handleSend = async (e) => {
      e.preventDefault();
      const input = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const prompt = input.value.trim();

      if (!prompt) return;

      appendMessage("user", prompt);
      input.value = "";
      input.disabled = true;
      sendBtn.disabled = true;

      const aiResponseElement = appendMessage("assistant", "...");
      
      try {
        let fullResponse = "";
        
        // Wllama's completion API
        await engine.createCompletion(prompt, {
          nPredict: 500,
          sampling: { temp: 0.7, top_k: 40, top_p: 0.9 },
          onNewToken: (token, piece, currentText) => {
            fullResponse += piece;
            aiResponseElement.innerText = fullResponse;
            chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
          }
        });
      } catch (err) {
        aiResponseElement.innerText = "Error generating response.";
        console.error("Inference error:", err);
      }

      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    };
  </script>
</body>
</html>
