<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>In-Browser LLM</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 80px; }
    #output { white-space: pre-wrap; background: #f4f4f4; padding: 1rem; border-radius: 6px; min-height: 100px; margin-top: 1rem; }
  </style>
</head>
<body>

  <h2>Browser-Based LLM</h2>
  <button id="load-btn" onclick="initModel()">1. Load Model (~1.5GB)</button>
  <p id="status"></p>

  <textarea id="prompt" placeholder="Type your prompt here..." disabled></textarea><br>
  <button id="send-btn" onclick="generate()" disabled>2. Generate</button>

  <div id="output"></div>

  <!-- Load WebLLM directly via CDN -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine;
    const selectedModel = "SmolLM-360M-Instruct-q4f16_1-MLC"; // Ultra-light model for quick testing

    window.initModel = async () => {
      const status = document.getElementById("status");
      status.innerText = "Loading model into browser cache/GPU... (Check console)";
      
      engine = await webllm.CreateMLCEngine(
        selectedModel,
        { initProgressCallback: (report) => { status.innerText = report.text; } }
      );

      status.innerText = "Model loaded and ready!";
      document.getElementById("prompt").disabled = false;
      document.getElementById("send-btn").disabled = false;
    };

    window.generate = async () => {
      const promptText = document.getElementById("prompt").value;
      const outputDiv = document.getElementById("output");
      outputDiv.innerText = "";

      const messages = [{ role: "user", content: promptText }];
      const chunks = await engine.chat.completions.create({ messages, stream: true });

      for await (const chunk of chunks) {
        outputDiv.innerText += chunk.choices[0]?.delta?.content || "";
      }
    };
  </script>
</body>
</html>
