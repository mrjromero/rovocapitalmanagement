<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Flow Stack Simulator Dashboard</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f3f4f6;
            --panel-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --card-bg: #ffffff;
            --snapshot-bg: #f9fafb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            max-width: 1000px;
            width: 100%;
        }
        @media (min-width: 768px) {
            .dashboard-container {
                grid-template-columns: 400px 1fr;
            }
        }
        .form-panel {
            background-color: var(--panel-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
            height: fit-content;
        }
        .results-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input[type="number"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .radio-group {
            margin-bottom: 12px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            font-size: 0.875rem;
            font-weight: 400;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .radio-label input {
            margin-right: 8px;
        }
        .checkbox-panel {
            background-color: var(--snapshot-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-top: 16px;
            margin-bottom: 16px;
        }
        .checkbox-label {
            display: flex;
            align-items: flex-start;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
        }
        .checkbox-label input {
            margin-right: 10px;
            margin-top: 3px;
        }
        .checkbox-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 4px;
            display: block;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .btn-secondary {
            background-color: white;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background-color: var(--bg-color);
        }

        /* Result Cards Styles */
        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .snapshot-card {
            background-color: var(--snapshot-bg);
        }
        .card-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-value {
            font-size: 1.75rem;
            font-weight: 700;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: var(--text-main);
            margin-bottom: 4px;
            letter-spacing: -0.025em;
        }
        .card-subtext {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .snapshot-metric {
            margin-top: 16px;
        }
        .snapshot-metric-title {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .snapshot-metric-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- LEFT PANEL: INPUT FORM -->
    <div class="form-panel">
        <h2>Simulation Settings</h2>
        
        <div class="form-group">
            <label>Initial Line of Credit ($)</label>
            <input type="number" id="initialLOC" value="10000">
        </div>

        <div class="form-group">
            <label>LOC Interest Rate (%)</label>
            <input type="number" step="0.1" id="locInterestRate" value="5.5">
        </div>

        <div class="form-group">
            <label>Investment Rate of Return (%)</label>
            <input type="number" step="0.1" id="investmentRate" value="10">
        </div>

        <div class="form-group">
            <label>Investment Length (months)</label>
            <input type="number" id="investmentLength" value="36">
            <div class="hint">Amortization period for each investment (default: 36)</div>
        </div>

        <div class="form-group">
            <label>First Stack Month</label>
            <input type="number" id="firstStackMonth" value="1">
        </div>

        <div class="form-group">
            <label>Stack Increase Multiplier</label>
            <input type="number" step="0.1" id="stackMultiplier" value="1.5">
            <div class="hint">Each new stack = previous stack × this multiplier</div>
        </div>

        <div class="form-group">
            <label>Personal Cash Flow ($/month)</label>
            <input type="number" id="personalCashFlow" value="2000">
        </div>

        <div class="form-group">
            <label>When to Increase Stack Size</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="increaseTrigger" value="payoff" checked onchange="updateThresholdUI()">
                    When LOC is paid off within a certain number of months
                </label>
                <label class="radio-label">
                    <input type="radio" name="increaseTrigger" value="stacks" onchange="updateThresholdUI()">
                    Every certain number of stacks created
                </label>
                <label class="radio-label">
                    <input type="radio" name="increaseTrigger" value="months" onchange="updateThresholdUI()">
                    Every certain number of months
                </label>
            </div>
        </div>

        <div class="form-group">
            <label id="thresholdLabel">Payoff Threshold (months)</label>
            <input type="number" step="0.1" id="thresholdValue" value="3.2">
            <div class="hint" id="thresholdHint">Increase stack size if LOC is paid off in this many months or less</div>
        </div>

        <div class="checkbox-panel">
            <label class="checkbox-label">
                <input type="checkbox" id="useCreditBalance">
                <div>
                    Use Credit Balance for Larger Stacks
                    <span class="checkbox-hint">When creating a new stack, if there's a credit balance on the LOC, use it to deploy a larger investment.</span>
                </div>
            </label>
        </div>

        <div class="form-group">
            <label>Total Years to Project</label>
            <input type="number" id="totalYears" value="10">
            <div class="hint">Project calculations for up to 50 years</div>
        </div>

        <div style="margin-top: 30px;">
            <button class="btn" onclick="runSimulation(false)">Run Simulation</button>
            <button class="btn btn-secondary" onclick="runSimulation(true)">Download CSV Data</button>
        </div>
    </div>

    <!-- RIGHT PANEL: RESULTS CARDS -->
    <div class="results-panel" id="results-container">
        <!-- Cards will be injected here by JS -->
        <div style="color: var(--text-muted); font-size: 0.875rem; padding: 20px;">
            Click "Run Simulation" to generate your metrics.
        </div>
    </div>
</div>

<script>
    function updateThresholdUI() {
        const trigger = document.querySelector('input[name="increaseTrigger"]:checked').value;
        const label = document.getElementById('thresholdLabel');
        const hint = document.getElementById('thresholdHint');

        if (trigger === 'payoff') {
            label.innerText = 'Payoff Threshold (months)';
            hint.innerText = 'Increase stack size if LOC is paid off in this many months or less';
        } else if (trigger === 'stacks') {
            label.innerText = 'Stack Threshold Count';
            hint.innerText = 'Increase stack size every X stacks (e.g. 4 means increase on stacks 4, 8, 12...)';
        } else if (trigger === 'months') {
            label.innerText = 'Month Threshold';
            hint.innerText = 'Create a new larger stack every X months (e.g. 12 means annually)';
        }
    }

    // Standard Amortized Loan PMT Formula
    function calculatePMT(ratePerPeriod, numberOfPeriods, presentValue) {
        if (ratePerPeriod === 0) return presentValue / numberOfPeriods;
        return (presentValue * ratePerPeriod) / (1 - Math.pow(1 + ratePerPeriod, -numberOfPeriods));
    }

    // Currency Formatter
    const formatCurrency = (val) => new Intl.NumberFormat('en-US', { 
        style: 'currency', 
        currency: 'USD', 
        maximumFractionDigits: 0 
    }).format(val);

    function runSimulation(downloadCSV = false) {
        // Gather Inputs
        const initialLOC = parseFloat(document.getElementById('initialLOC').value) || 0;
        const locInterestRate = parseFloat(document.getElementById('locInterestRate').value) || 0;
        const investmentRate = parseFloat(document.getElementById('investmentRate').value) || 0;
        const investmentLength = parseInt(document.getElementById('investmentLength').value) || 36;
        const firstStackMonth = parseInt(document.getElementById('firstStackMonth').value) || 1;
        const stackMultiplier = parseFloat(document.getElementById('stackMultiplier').value) || 1;
        const personalCashFlow = parseFloat(document.getElementById('personalCashFlow').value) || 0;
        const increaseTrigger = document.querySelector('input[name="increaseTrigger"]:checked').value;
        const thresholdValue = parseFloat(document.getElementById('thresholdValue').value) || 1; 
        const useCreditBalance = document.getElementById('useCreditBalance').checked;
        const totalYears = parseInt(document.getElementById('totalYears').value) || 10;

        // Initialize State Variables
        let maxMonths = totalYears * 12;
        let locBalance = 0; 
        let currentStackBaseSize = initialLOC; 
        let stacks = [];
        let stackCount = 0;
        let monthsSinceLastStack = 0;
        let csvData = [];
        let maxActiveStacks = 0; 
        
        // Metrics Trackers
        let totalLOCInterestPaid = 0;

        // Run Month-by-Month Loop
        for (let month = 1; month <= maxMonths; month++) {
            let stackIncomeThisMonth = 0;
            let activeStacksThisMonth = {};

            // Calculate LOC Interest if in debt (balance is negative)
            if (locBalance < 0) {
                let interestCharge = Math.abs(locBalance) * (locInterestRate / 100 / 12);
                totalLOCInterestPaid += interestCharge;
                locBalance -= interestCharge; 
            }

            // Calculate Cash Flow from active stacks
            stacks.forEach((stack, index) => {
                if (month >= stack.startMonth && month <= stack.endMonth) {
                    stackIncomeThisMonth += stack.pmt;
                    activeStacksThisMonth[`Stack ${index + 1}`] = stack.pmt;
                }
            });

            let totalIncome = personalCashFlow + stackIncomeThisMonth;
            
            // Apply Income to LOC
            locBalance += totalIncome;
            monthsSinceLastStack++;

            // Evaluate Buying a New Stack
            if (month >= firstStackMonth && locBalance >= 0) {
                
                let actualStackSize = currentStackBaseSize;

                // Handle the distinct increase logics based on exact definitions
                if (increaseTrigger === 'payoff') {
                    if (stackCount > 0 && monthsSinceLastStack <= thresholdValue) {
                        currentStackBaseSize *= stackMultiplier;
                    }
                    actualStackSize = currentStackBaseSize;
                } 
                else if (increaseTrigger === 'stacks') {
                    if (stackCount > 0 && (stackCount + 1) % thresholdValue === 0) {
                        currentStackBaseSize *= stackMultiplier;
                    }
                    actualStackSize = currentStackBaseSize;
                } 
                else if (increaseTrigger === 'months') {
                    let multiplierTiersPassed = Math.floor((month - 1) / thresholdValue);
                    actualStackSize = initialLOC * Math.pow(stackMultiplier, multiplierTiersPassed);
                }

                // Handle 'Use Credit Balance'
                if (useCreditBalance && locBalance > 0) {
                    actualStackSize += locBalance;
                    locBalance = -(actualStackSize - locBalance); 
                } else {
                    locBalance -= actualStackSize; 
                }

                stackCount++;
                maxActiveStacks = Math.max(maxActiveStacks, stackCount);
                
                let pmt = calculatePMT(investmentRate / 100 / 12, investmentLength, actualStackSize);

                stacks.push({
                    id: stackCount,
                    size: actualStackSize,
                    startMonth: month, 
                    endMonth: month + investmentLength - 1,
                    pmt: pmt
                });

                monthsSinceLastStack = 0;
                activeStacksThisMonth[`Stack ${stackCount}`] = pmt;
            }

            // Record Row Data for CSV
            if (downloadCSV) {
                let row = {
                    'Month': month,
                    'LOC Balance': locBalance.toFixed(2),
                    'Personal Input': personalCashFlow.toFixed(2),
                    'Total Income': totalIncome.toFixed(2)
                };
                for (let s = 1; s <= stackCount; s++) {
                    row[`Stack ${s}`] = activeStacksThisMonth[`Stack ${s}`] ? activeStacksThisMonth[`Stack ${s}`].toFixed(2) : '';
                }
                csvData.push(row);
            }
        }

        // ==========================================
        // CALCULATE FINAL CARD METRICS
        // ==========================================
        
        let totalDeployed = 0;
        let totalEarnings = 0;
        let activeStacksStillPayingCount = 0;
        let monthlyIncomeFromActiveStacks = 0;
        let remainingFutureIncome = 0;
        
        stacks.forEach(stack => {
            totalDeployed += stack.size;
            let stackLifetimeEarnings = stack.pmt * investmentLength;
            totalEarnings += stackLifetimeEarnings;

            // Snapshot logic: Active at the end of the simulation period
            if (stack.endMonth >= maxMonths) {
                activeStacksStillPayingCount++;
                monthlyIncomeFromActiveStacks += stack.pmt;
                
                // Income that will arrive AFTER the simulation ends
                let remainingMonths = stack.endMonth - maxMonths;
                if (remainingMonths > 0) {
                    remainingFutureIncome += (remainingMonths * stack.pmt);
                }
            }
        });

        let netInvestmentProfit = totalEarnings - totalDeployed;
        let personalCashContributed = personalCashFlow * maxMonths;

        // Render Dashboard Cards
        renderDashboard({
            netInvestmentProfit,
            totalEarnings,
            totalDeployed,
            personalCashContributed,
            totalLOCInterestPaid,
            totalStacks: stackCount,
            totalYears,
            activeStacksStillPayingCount,
            monthlyIncomeFromActiveStacks,
            remainingFutureIncome
        });

        // Generate CSV if requested
        if (downloadCSV && csvData.length > 0) {
            generateCSV(csvData, maxActiveStacks);
        }
    }

    function renderDashboard(metrics) {
        const container = document.getElementById('results-container');
        
        container.innerHTML = `
            <!-- Net Investment Profit -->
            <div class="metric-card">
                <div class="card-title">Net Investment Profit</div>
                <div class="card-value">${formatCurrency(metrics.netInvestmentProfit)}</div>
                <div class="card-subtext">${formatCurrency(metrics.totalEarnings)} earnings &ndash; ${formatCurrency(metrics.totalDeployed)} deployed</div>
            </div>

            <!-- Investment Earnings -->
            <div class="metric-card">
                <div class="card-title">Investment Earnings</div>
                <div class="card-value">${formatCurrency(metrics.totalEarnings)}</div>
                <div class="card-subtext">Total payments received (principal + profit)</div>
            </div>

            <!-- Personal Cash Contributed -->
            <div class="metric-card">
                <div class="card-title">Personal Cash Contributed</div>
                <div class="card-value">${formatCurrency(metrics.personalCashContributed)}</div>
                <div class="card-subtext">Cash flow, bonuses & recurring income</div>
            </div>

            <!-- LOC Interest Paid -->
            <div class="metric-card">
                <div class="card-title">LOC Interest Paid</div>
                <div class="card-value">${formatCurrency(metrics.totalLOCInterestPaid)}</div>
                <div class="card-subtext">Cost of borrowing</div>
            </div>

            <!-- Cash Withdrawn -->
            <div class="metric-card">
                <div class="card-title">Cash Withdrawn</div>
                <div class="card-value">$0</div>
                <div class="card-subtext">Not configured</div>
            </div>

            <!-- Total Stacks -->
            <div class="metric-card">
                <div class="card-title">Total Stacks</div>
                <div class="card-value">${metrics.totalStacks}</div>
                <div class="card-subtext">Investment cycles</div>
            </div>

            <!-- Snapshot Card -->
            <div class="metric-card snapshot-card">
                <div class="card-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    End of Year ${metrics.totalYears} Snapshot
                </div>
                
                <div class="snapshot-metric">
                    <div class="snapshot-metric-title">Active Stacks Still Paying</div>
                    <div class="snapshot-metric-value">${metrics.activeStacksStillPayingCount}</div>
                </div>

                <div class="snapshot-metric">
                    <div class="snapshot-metric-title">Monthly Income from Stacks</div>
                    <div class="snapshot-metric-value">${formatCurrency(metrics.monthlyIncomeFromActiveStacks)}</div>
                </div>

                <div class="snapshot-metric">
                    <div class="snapshot-metric-title">Remaining Future Income</div>
                    <div class="snapshot-metric-value">${formatCurrency(metrics.remainingFutureIncome)}</div>
                </div>
            </div>
        `;
    }

    function generateCSV(data, maxStacks) {
        let headers = ['Month', 'LOC Balance', 'Personal Input', 'Total Income'];
        for (let i = 1; i <= maxStacks; i++) {
            headers.push(`Stack ${i}`);
        }

        let csvRows = [];
        csvRows.push(headers.join(',')); 

        data.forEach(row => {
            let values = headers.map(header => {
                let val = row[header] !== undefined ? row[header] : '';
                return `"${val}"`; 
            });
            csvRows.push(values.join(','));
        });

        let csvString = csvRows.join('\n');
        let blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
        let url = URL.createObjectURL(blob);
        
        let link = document.createElement("a");
        link.setAttribute("href", url);
        
        let dateStr = new Date().toISOString().replace(/[:.]/g, '-');
        link.setAttribute("download", `cashflow_simulation_${dateStr}.csv`);
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
