<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Local P2P Share</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    :root { --primary: #007bff; --bg: #f4f7f6; --card-bg: #ffffff; --border: #dcdcdc; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
    .app-container { background: var(--card-bg); width: 100%; max-width: 480px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 20px; box-sizing: border-box; }
    h2 { margin: 0 0 15px 0; font-size: 1.4rem; text-align: center; color: #333; }
    .id-box { background: #e9ecef; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; word-break: break-all; }
    .controls { display: flex; gap: 8px; margin-bottom: 10px; }
    input[type="text"], input[type="file"] { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    button { padding: 10px 14px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; flex-shrink: 0; }
    button:disabled { background-color: #a0cbf5; cursor: not-allowed; }
    .lan-section { border: 1px solid #cce5ff; background: #f0f7ff; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .lan-title { font-weight: bold; font-size: 13px; color: #004085; display: flex; justify-content: space-between; margin-bottom: 6px; }
    .peer-chip { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #b8daff; padding: 6px 10px; border-radius: 6px; margin-top: 6px; font-size: 13px; }
    .sm-btn { padding: 4px 8px; font-size: 12px; background-color: #28a745; }
    #chat-box { height: 35vh; min-height: 220px; border: 1px solid var(--border); border-radius: 8px; overflow-y: auto; padding: 12px; margin: 12px 0; background: #fafafa; }
    .message { margin-bottom: 8px; font-size: 14px; line-height: 1.4; }
    .system-log { font-style: italic; color: #6c757d; margin-bottom: 8px; font-size: 13px; }
    a.download-link { color: var(--primary); font-weight: bold; text-decoration: none; word-break: break-all; }
  </style>
</head>
<body>
  <div class="app-container">
    <h2>⚡ Local P2P Share</h2>

    <!-- Name Input -->
    <div class="controls">
      <input type="text" id="display-name" placeholder="Your Display Name">
    </div>

    <!-- My Peer ID Box -->
    <div class="id-box">
      <span><strong>ID:</strong> <span id="my-id">Generating...</span></span>
      <button id="share-btn" style="padding: 4px 8px; font-size: 12px;" disabled>Copy Link</button>
    </div>

    <!-- Local LAN Discovery Panel -->
    <div class="lan-section">
      <div class="lan-title">
        <span>🌐 Local Devices</span>
        <span id="lan-status" style="font-weight: normal; color: #6c757d;">Scanning...</span>
      </div>
      <div id="lan-peer-list" style="font-size: 12px; color: #6c757d;">Searching network...</div>
    </div>

    <!-- Manual Connection Control -->
    <div class="controls">
      <input type="text" id="remote-id" placeholder="Enter peer ID manually">
      <button id="connect-btn">Connect</button>
    </div>

    <div id="chat-box"></div>

    <!-- Message Controls -->
    <div class="controls">
      <input type="text" id="msg-input" placeholder="Type a message..." disabled>
      <button id="send-btn" disabled>Send</button>
    </div>

    <!-- File Controls -->
    <div class="controls">
      <input type="file" id="file-input" disabled>
      <button id="send-file-btn" disabled>Send File</button>
    </div>
  </div>

  <script>
    const CHUNK_SIZE = 16384;
    let myPeerId = null;
    const connections = new Map();
    const discoveredPeers = new Map();
    const incomingTransfers = new Map();

    // 1. Vanity Name Generator & Persistence
    const ADJ = ['Swift', 'Neon', 'Solar', 'Brave', 'Clever', 'Cosmic', 'Turbo', 'Shadow', 'Crystal'];
    const ANI = ['Otter', 'Falcon', 'Panda', 'Fox', 'Dolphin', 'Eagle', 'Panther', 'Raven', 'Wolf'];
    
    const nameInput = document.getElementById('display-name');
    nameInput.value = localStorage.getItem('p2p_name') || `${ADJ[Math.floor(Math.random()*ADJ.length)]} ${ANI[Math.floor(Math.random()*ANI.length)]}`;
    nameInput.addEventListener('change', () => {
      localStorage.setItem('p2p_name', nameInput.value.trim());
      broadcast({ type: 'identity', name: nameInput.value.trim() });
    });

    // 2. PeerJS Setup
    const peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });

    peer.on('open', (id) => {
      myPeerId = id;
      document.getElementById('my-id').innerText = id;
      
      const shareUrl = `${window.location.origin}${window.location.pathname}?id=${id}`;
      const shareBtn = document.getElementById('share-btn');
      shareBtn.disabled = false;
      shareBtn.onclick = () => {
        navigator.clipboard.writeText(shareUrl);
        shareBtn.innerText = 'Copied!';
        setTimeout(() => shareBtn.innerText = 'Copy Link', 2000);
      };

      renderShareQR(shareUrl);
      initLanDiscovery(id);

      // URL parameter auto-connect
      const targetId = new URLSearchParams(window.location.search).get('id');
      if (targetId) connectToPeer(targetId);
    });

    peer.on('connection', (conn) => setupConnection(conn));

    document.getElementById('connect-btn').onclick = () => {
      const id = document.getElementById('remote-id').value.trim();
      if (id) connectToPeer(id);
    };

    function connectToPeer(remoteId) {
      if (remoteId === myPeerId || connections.has(remoteId)) return;
      setupConnection(peer.connect(remoteId));
    }

    // 3. Multi-Peer Management
    function setupConnection(conn) {
      conn.on('open', () => {
        connections.set(conn.peer, conn);
        updateUI();
        logSystem(`Connected to ${conn.peer}`);
        conn.send({ type: 'identity', name: nameInput.value.trim() });
      });

      conn.on('data', (data) => processData(data, conn.peer));
      
      const cleanup = () => {
        connections.delete(conn.peer);
        incomingTransfers.delete(conn.peer);
        updateUI();
        logSystem(`Peer disconnected.`);
      };
      conn.on('close', cleanup);
      conn.on('error', cleanup);
    }

    function broadcast(data) {
      connections.forEach(conn => { if (conn.open) conn.send(data); });
    }

    function updateUI() {
      const active = connections.size > 0;
      document.getElementById('msg-input').disabled = !active;
      document.getElementById('send-btn').disabled = !active;
      document.getElementById('file-input').disabled = !active;
      document.getElementById('send-file-btn').disabled = !active;
    }

    // 4. LAN Auto-Discovery (Public IP Matching via SSE)
    async function initLanDiscovery(peerId) {
      const statusEl = document.getElementById('lan-status');
      try {
        const res = await fetch('https://api4.ipify.org?format=json');
        const data = await res.json();
        const topic = 'p2plan-' + data.ip.replace(/[^a-zA-Z0-9]/g, '');
        statusEl.textContent = `IP: ${data.ip}`;

        const sse = new EventSource(`https://ntfy.sh/${topic}/sse`);
        sse.onmessage = (e) => {
          try {
            const payload = JSON.parse(JSON.parse(e.data).message);
            if (payload.peerId && payload.peerId !== myPeerId) {
              discoveredPeers.set(payload.peerId, { name: payload.name, lastSeen: Date.now() });
              renderLanList();
            }
          } catch(err) {}
        };

        const ping = () => {
          fetch(`https://ntfy.sh/${topic}`, {
            method: 'POST',
            body: JSON.stringify({ peerId: peerId, name: nameInput.value.trim() })
          }).catch(() => {});
        };
        ping();
        setInterval(ping, 6000);

        // Prune inactive peers (>18s)
        setInterval(() => {
          const now = Date.now();
          discoveredPeers.forEach((p, id) => { if (now - p.lastSeen > 18000) discoveredPeers.delete(id); });
          renderLanList();
        }, 4000);

      } catch (err) {
        statusEl.textContent = 'Discovery Offline';
      }
    }

    function renderLanList() {
      const list = document.getElementById('lan-peer-list');
      if (discoveredPeers.size === 0) {
        list.textContent = 'No other devices detected on this network.';
        return;
      }
      list.innerHTML = '';
      discoveredPeers.forEach((p, id) => {
        const div = document.createElement('div');
        div.className = 'peer-chip';
        div.innerHTML = `<span>📱 <strong>${escapeHTML(p.name)}</strong></span>`;
        
        const btn = document.createElement('button');
        btn.className = 'sm-btn';
        btn.textContent = connections.has(id) ? 'Connected' : 'Connect';
        btn.disabled = connections.has(id);
        btn.onclick = () => connectToPeer(id);
        
        div.appendChild(btn);
        list.appendChild(div);
      });
    }

    // 5. Data & File Transfer Protocol
    function processData(data, senderId) {
      const conn = connections.get(senderId);
      const senderName = conn?.name || senderId;

      if (typeof data === 'string') return logMsg(senderName, data);

      if (data.type === 'identity') {
        if (conn) conn.name = data.name;
        renderLanList();
        return;
      }

      if (data.type === 'file-header') {
        incomingTransfers.set(senderId, { name: data.name, type: data.filetype, chunks: [] });
      } else if (data.type === 'file-chunk') {
        incomingTransfers.get(senderId)?.chunks.push(data.chunk);
      } else if (data.type === 'file-complete') {
        const transfer = incomingTransfers.get(senderId);
        if (transfer) {
          const blob = new Blob(transfer.chunks, { type: transfer.type });
          logDownload(senderName, URL.createObjectURL(blob), transfer.name);
          incomingTransfers.delete(senderId);
        }
      }
    }

    // 6. User Action Handlers
    document.getElementById('send-btn').onclick = () => {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (text) {
        broadcast(text);
        logMsg('You', text);
        input.value = '';
      }
    };

    document.getElementById('send-file-btn').onclick = async () => {
      const input = document.getElementById('file-input');
      const file = input.files[0];
      if (!file) return;

      logSystem(`Sending ${file.name}...`);
      broadcast({ type: 'file-header', name: file.name, filetype: file.type });

      let offset = 0;
      while (offset < file.size) {
        const buffer = await file.slice(offset, offset + CHUNK_SIZE).arrayBuffer();
        broadcast({ type: 'file-chunk', chunk: buffer });
        offset += CHUNK_SIZE;
      }

      broadcast({ type: 'file-complete' });
      logSystem(`Sent ${file.name}`);
      input.value = '';
    };

    // 7. Display & Log Utilities
    function renderShareQR(url) {
      const chat = document.getElementById('chat-box');
      const box = document.createElement('div');
      box.style.textAlign = 'center';
      box.style.padding = '10px';
      box.innerHTML = `<div style="font-weight:bold; font-size:13px; margin-bottom:6px;">Scan to Auto-Join</div>`;
      
      const canvas = document.createElement('canvas');
      new QRious({ element: canvas, value: url, size: 150 });
      box.appendChild(canvas);
      chat.appendChild(box);
    }

    function escapeHTML(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function logMsg(sender, text) {
      const chat = document.getElementById('chat-box');
      chat.innerHTML += `<div class="message"><strong>${escapeHTML(sender)}:</strong> ${escapeHTML(text)}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }
    function logSystem(text) {
      const chat = document.getElementById('chat-box');
      chat.innerHTML += `<div class="system-log">System: ${escapeHTML(text)}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }
    function logDownload(sender, url, filename) {
      const chat = document.getElementById('chat-box');
      chat.innerHTML += `<div class="message"><strong>${escapeHTML(sender)}:</strong> <a class="download-link" href="${url}" download="${escapeHTML(filename)}">Download ${escapeHTML(filename)}</a></div>`;
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
