<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>P2P Group File Transfer & Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --primary: #007bff;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --border: #dcdcdc;
    }
    
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background-color: var(--bg);
      margin: 0; 
      padding: 15px; 
      display: flex;
      justify-content: center;
    }

    .app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      padding: 20px;
      box-sizing: border-box;
    }

    h2 { margin-top: 0; font-size: 1.5rem; text-align: center; }

    .id-container {
      background: #e9ecef;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      word-break: break-all;
    }

    .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    
    input[type="text"], input[type="file"] { 
      flex: 1; 
      min-width: 150px;
      padding: 12px; 
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px; 
      box-sizing: border-box;
    }
    
    button { 
      padding: 12px 16px; 
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer; 
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    
    button:disabled { background-color: #a0cbf5; cursor: not-allowed; }
    button:active { opacity: 0.8; }
    
    .copy-btn { padding: 6px 12px; font-size: 14px; border-radius: 6px; }
    .secondary-btn { background-color: #6c757d; font-size: 14px; width: 100%; }
    
    .qr-section, .lan-section {
      background: #f8f9fa;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: center;
    }

    .lan-section {
      border: 1px solid #cce5ff;
      background: #f0f7ff;
      text-align: left;
    }

    .lan-title {
      font-weight: bold;
      font-size: 14px;
      color: #004085;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .peer-chip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border: 1px solid #b8daff;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 6px;
      font-size: 13px;
    }

    .connect-sm-btn {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
      background-color: #28a745;
    }

    #connected-peers-bar {
      font-size: 0.85em;
      font-weight: bold;
      color: #6c757d;
      margin-bottom: 8px;
    }

    #webcam { width: 100%; border-radius: 8px; margin-top: 8px; background: #000; }
    #qr-canvas { display: block; margin: 10px auto; max-width: 100%; height: auto; border-radius: 8px; background: #fff; padding: 8px; }
    
    #chat-box { 
      height: 40vh; 
      min-height: 250px;
      border: 1px solid var(--border); 
      border-radius: 8px;
      overflow-y: auto; 
      padding: 12px; 
      margin: 15px 0; 
      background: #fafafa;
      word-wrap: break-word;
    }
    
    .message { margin-bottom: 8px; line-height: 1.4; }
    
    .debug-log { 
      margin-bottom: 8px; 
      font-size: 0.85em; 
      color: #6c757d; 
      font-family: monospace; 
    }
    
    a.download-link { color: var(--primary); font-weight: bold; text-decoration: none; word-break: break-all; }
    a.download-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="app-container">
    <h2>P2P Group Transfer</h2>

    <!-- Display Name Control -->
    <div class="controls" style="margin-bottom: 12px;">
      <label style="font-weight: bold; font-size: 14px; display: flex; align-items: center; width: 100%; gap: 8px;">
        Your Name:
        <input type="text" id="display-name" style="padding: 8px; font-size: 14px;" placeholder="Your Name">
      </label>
    </div>
    
    <div class="id-container">
      <span><strong>Your ID:</strong> <span id="my-id">Generating...</span></span>
      <button id="share-btn" class="copy-btn" disabled>Share Link</button>
    </div>

    <!-- LAN Auto-Discovery Panel -->
    <div class="lan-section">
      <div class="lan-title">
        <span>🌐 Local Network Peers</span>
        <span id="lan-status" style="font-weight: normal; font-size: 11px; color: #6c757d;">Scanning...</span>
      </div>
      <div id="lan-peer-list" class="debug-log">Searching for devices on your network...</div>
    </div>
    
    <div class="controls">
      <input type="text" id="remote-id" placeholder="Enter friend's ID">
      <button id="connect-btn">Connect</button>
    </div>

    <!-- QR Handshake Fallback Trigger -->
    <div class="controls">
      <button id="qr-toggle-btn" class="secondary-btn">📷 Offline / QR Handshake Fallback</button>
    </div>

    <!-- QR Handshake Workspace -->
    <div id="qr-section" class="qr-section" style="display: none;">
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <button id="qr-host-btn" style="flex:1; font-size: 14px;">Host (Create Offer)</button>
        <button id="qr-join-btn" style="flex:1; font-size: 14px;">Join (Scan Offer)</button>
      </div>
      <div id="qr-status" class="debug-log">Select Host or Joiner to connect serverless via camera</div>
      <canvas id="qr-canvas" style="display:none;"></canvas>
      <video id="webcam" playsinline autoplay muted hidden></video>
      <canvas id="video-canvas" hidden></canvas>
      <button id="qr-action-btn" style="display:none; margin-top: 8px; width: 100%;"></button>
    </div>
    
    <div id="connected-peers-bar">Connected Peers (0): None</div>
    
    <div id="chat-box"></div>
    
    <div class="controls">
      <input type="text" id="msg-input" placeholder="Type a message..." disabled>
      <button id="send-btn" disabled>Send</button>
    </div>

    <div class="controls">
      <input type="file" id="file-input" disabled>
      <button id="send-file-btn" disabled>Send File</button>
    </div>
  </div>

  <script>
    const CHUNK_SIZE = 16384; // 16 KB safe chunk size
    let myPeerId = null;
    let scanStream = null;
    let nativePc = null;

    // Multi-Peer Mesh Map: Map<peerId, { id, name, isPeerJS, send: fn, bufferedAmount: getter }>
    const connections = new Map();
    const incomingTransfers = new Map();

    // Reconnection tracking
    const knownConnectedNames = new Set();
    const reconnectAttempts = new Map();

    // LAN Auto-discovery variables
    let discoveredPeers = new Map();
    let lanTopic = null;
    let announceInterval = null;

    // --- VANITY NAME GENERATOR & LOCALSTORAGE PERSISTENCE ---
    const ADJECTIVES = ['Swift', 'Neon', 'Solar', 'Cozy', 'Brave', 'Silent', 'Clever', 'Cosmic', 'Turbo', 'Shadow', 'Electric', 'Lunar', 'Velvet', 'Crystal'];
    const ANIMALS = ['Otter', 'Falcon', 'Panda', 'Fox', 'Dolphin', 'Eagle', 'Badger', 'Lynx', 'Panther', 'Raven', 'Tiger', 'Koala', 'Hawk', 'Wolf'];

    function getInitialDisplayName() {
      const savedName = localStorage.getItem('p2p_user_name');
      if (savedName && savedName.trim()) return savedName.trim();

      const adj = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
      const animal = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
      const vanityName = `${adj} ${animal}`;

      localStorage.setItem('p2p_user_name', vanityName);
      return vanityName;
    }

    const nameInput = document.getElementById('display-name');
    nameInput.value = getInitialDisplayName();

    nameInput.addEventListener('change', (e) => {
      const newName = e.target.value.trim() || 'Anonymous';
      localStorage.setItem('p2p_user_name', newName);
      broadcastData({ type: 'identity', name: newName });
    });

    const qrGen = new QRious({ element: document.getElementById('qr-canvas'), size: 280, level: 'L' });

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
      ]
    };

    const peer = new Peer({ config: rtcConfig }); 

    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('id');

    peer.on('open', (id) => {
      myPeerId = id;
      document.getElementById('my-id').innerText = id;
      
      const shareBtn = document.getElementById('share-btn');
      shareBtn.disabled = false;
      const shareUrl = `${window.location.origin}${window.location.pathname}?id=${id}`;
      
      showShareQR(shareUrl);

      shareBtn.addEventListener('click', async () => {
        if (navigator.share) {
          try {
            await navigator.share({ url: shareUrl });
          } catch (err) {
            console.log('User cancelled share or share failed', err);
          }
        } else {
          navigator.clipboard.writeText(shareUrl).then(() => {
            const originalText = shareBtn.innerText;
            shareBtn.innerText = 'Link Copied!';
            setTimeout(() => { shareBtn.innerText = originalText; }, 2000);
          }).catch(err => console.error('Failed to copy: ', err));
        }
      });

      initLanDiscovery(id);

      if (targetPeerId) {
        document.getElementById('remote-id').value = targetPeerId;
        logSystem('Auto-connecting to link...');
        setTimeout(() => { handlePeerJSConnect(targetPeerId); }, 500);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });

    peer.on('connection', (conn) => {
      setupPeerJSConnection(conn);
    });

    document.getElementById('connect-btn').addEventListener('click', () => {
      const remoteId = document.getElementById('remote-id').value.trim();
      if (!remoteId) return;
      handlePeerJSConnect(remoteId);
    });

    function handlePeerJSConnect(remoteId) {
      if (remoteId === myPeerId) return;
      if (connections.has(remoteId)) return;
      const conn = peer.connect(remoteId);
      setupPeerJSConnection(conn);
    }

    // ==========================================
    // MULTI-PEER MESH ENGINE
    // ==========================================
    function addConnection(peerId, connWrapper) {
      if (connections.has(peerId)) return;
      connections.set(peerId, connWrapper);

      updateControlsState();
      updateConnectedPeersBar();

      // Send identity packet on open
      const myName = nameInput.value.trim() || 'Anonymous';
      connWrapper.send({ type: 'identity', name: myName });
    }

    function removeConnection(peerId) {
      if (connections.has(peerId)) {
        const conn = connections.get(peerId);
        const name = conn.name || peerId;
        connections.delete(peerId);
        logSystem(`${name} disconnected.`);
        updateControlsState();
        updateConnectedPeersBar();
      }
    }

    function updateControlsState() {
      const hasPeers = connections.size > 0;
      document.getElementById('msg-input').disabled = !hasPeers;
      document.getElementById('send-btn').disabled = !hasPeers;
      document.getElementById('file-input').disabled = !hasPeers;
      document.getElementById('send-file-btn').disabled = !hasPeers;
    }

    function updateConnectedPeersBar() {
      const bar = document.getElementById('connected-peers-bar');
      if (connections.size === 0) {
        bar.textContent = "Connected Peers (0): None";
        bar.style.color = "#6c757d";
      } else {
        const peerNames = Array.from(connections.values()).map(c => c.name || c.id).join(', ');
        bar.textContent = `Connected Peers (${connections.size}): ${peerNames}`;
        bar.style.color = "#28a745";
      }
    }

    function broadcastData(data) {
      connections.forEach((conn) => {
        try {
          conn.send(data);
        } catch(err) {
          console.error("Broadcast failed for peer", conn.id, err);
        }
      });
    }

    function setupPeerJSConnection(conn) {
      const connWrapper = {
        id: conn.peer,
        name: conn.peer,
        isPeerJS: true,
        rawConn: conn,
        send: (data) => conn.send(data),
        get bufferedAmount() {
          return conn.dataChannel ? conn.dataChannel.bufferedAmount : 0;
        }
      };

      conn.on('open', () => {
        reconnectAttempts.delete(conn.peer); // Clear retries on success
        addConnection(conn.peer, connWrapper);
        logSystem(`Connected to ${conn.peer}`);
      });

      conn.on('data', (data) => {
        processIncomingData(data, conn.peer);
      });

      const handleDrop = () => {
        const connInfo = connections.get(conn.peer);
        const peerName = connInfo ? (connInfo.name || conn.peer) : conn.peer;
        
        removeConnection(conn.peer);

        // Auto-reconnect up to 3 times for transient drops
        let attempts = reconnectAttempts.get(conn.peer) || 0;
        if (attempts < 3) {
          reconnectAttempts.set(conn.peer, attempts + 1);
          logSystem(`Connection to ${peerName} lost. Reconnecting (Attempt ${attempts + 1}/3)...`);
          
          setTimeout(() => {
            if (!connections.has(conn.peer)) {
              handlePeerJSConnect(conn.peer);
            }
          }, 3000 * (attempts + 1));
        }
      };

      conn.on('close', handleDrop);
      conn.on('error', handleDrop);
    }

    // ==========================================
    // PUBLIC IP MATCHING (SAME-LAN AUTO-DISCOVERY)
    // ==========================================
    async function initLanDiscovery(peerId) {
      const statusEl = document.getElementById('lan-status');
      try {
        const res = await fetch('https://api4.ipify.org?format=json');
        const data = await res.json();
        const publicIp = data.ip;

        lanTopic = 'p2plan-' + publicIp.replace(/[^a-zA-Z0-9]/g, '');
        statusEl.textContent = `IP: ${publicIp}`;

        const eventSource = new EventSource(`https://ntfy.sh/${lanTopic}/sse`);

        eventSource.onmessage = (event) => {
          try {
            const msgData = JSON.parse(event.data);
            if (!msgData.message) return;
            
            const payload = JSON.parse(msgData.message);

            if (payload.peerId && payload.peerId !== myPeerId) {
              discoveredPeers.set(payload.peerId, {
                name: payload.name || payload.peerId,
                lastSeen: Date.now()
              });

              // Auto-reconnect if a refreshed peer's display name is recognized
              const isConnected = connections.has(payload.peerId);
              const isKnownPeer = knownConnectedNames.has(payload.name);

              if (!isConnected && isKnownPeer) {
                logSystem(`Peer "${payload.name}" refreshed. Auto-reconnecting...`);
                handlePeerJSConnect(payload.peerId);
              }

              renderLanPeers();
            }
          } catch (err) {}
        };

        const sendAnnounce = () => {
          const myName = nameInput.value.trim() || 'Anonymous';
          // Raw string body so ntfy doesn't treat JSON keys as HTTP headers/configs
          fetch(`https://ntfy.sh/${lanTopic}`, {
            method: 'POST',
            body: JSON.stringify({ peerId: peerId, name: myName, timestamp: Date.now() })
          }).catch(() => {});
        };

        sendAnnounce();
        announceInterval = setInterval(sendAnnounce, 5000);

        setInterval(() => {
          const now = Date.now();
          let changed = false;
          discoveredPeers.forEach((data, pid) => {
            if (now - data.lastSeen > 15000) {
              discoveredPeers.delete(pid);
              changed = true;
            }
          });
          if (changed) renderLanPeers();
        }, 3000);

      } catch (err) {
        statusEl.textContent = 'Offline / Blocked';
        document.getElementById('lan-peer-list').textContent = 'LAN auto-discovery unavailable.';
      }
    }

    function renderLanPeers() {
      const listEl = document.getElementById('lan-peer-list');
      if (discoveredPeers.size === 0) {
        listEl.textContent = 'No other peers found on this local network yet.';
        return;
      }

      listEl.innerHTML = '';
      discoveredPeers.forEach((data, pid) => {
        const chip = document.createElement('div');
        chip.className = 'peer-chip';
        
        const idSpan = document.createElement('span');
        idSpan.innerHTML = `📱 <strong>${escapeHTML(data.name)}</strong> <small style="color:#6c757d;">(${escapeHTML(pid)})</small>`;
        
        const connBtn = document.createElement('button');
        connBtn.className = 'connect-sm-btn';
        connBtn.textContent = connections.has(pid) ? 'Connected' : 'Connect';
        connBtn.disabled = connections.has(pid);
        connBtn.onclick = () => {
          document.getElementById('remote-id').value = pid;
          handlePeerJSConnect(pid);
        };

        chip.appendChild(idSpan);
        chip.appendChild(connBtn);
        listEl.appendChild(chip);
      });
    }

    function showShareQR(url) {
      const chatBox = document.getElementById('chat-box');
      const container = document.createElement('div');
      container.className = 'message';
      container.style.textAlign = 'center';
      container.style.backgroundColor = '#ffffff';
      container.style.padding = '12px';
      container.style.borderRadius = '8px';
      container.style.border = '1px solid var(--border)';
      container.style.margin = '10px 0';

      const title = document.createElement('div');
      title.style.fontSize = '14px';
      title.style.fontWeight = 'bold';
      title.style.marginBottom = '4px';
      title.style.color = '#333';
      title.textContent = 'Scan to Connect';

      const subtitle = document.createElement('div');
      subtitle.style.fontSize = '12px';
      subtitle.style.color = '#6c757d';
      subtitle.style.marginBottom = '10px';
      subtitle.textContent = 'Scan with phone camera to auto-join this peer';

      const canvas = document.createElement('canvas');
      canvas.style.display = 'block';
      canvas.style.margin = '0 auto';

      new QRious({ element: canvas, value: url, size: 180, level: 'L' });

      container.appendChild(title);
      container.appendChild(subtitle);
      container.appendChild(canvas);

      chatBox.appendChild(container);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Toggle QR Fallback Section
    document.getElementById('qr-toggle-btn').addEventListener('click', () => {
      const sec = document.getElementById('qr-section');
      sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('qr-host-btn').addEventListener('click', startAsHost);
    document.getElementById('qr-join-btn').addEventListener('click', startAsJoiner);

    // ==========================================
    // SERVERLESS QR WEBRTC HANDSHAKE
    // ==========================================
    function setupNativeDataChannel(channel, peerId) {
      const connWrapper = {
        id: peerId,
        name: peerId,
        isPeerJS: false,
        rawConn: channel,
        send: (data) => {
          if (data && typeof data === 'object' && !(data instanceof ArrayBuffer) && !(data instanceof Blob)) {
            if (data.type === 'file-chunk' && data.chunk instanceof ArrayBuffer) {
              const bytes = new Uint8Array(data.chunk);
              let binary = '';
              for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
              }
              const base64Chunk = btoa(binary);
              channel.send(JSON.stringify({
                type: 'file-chunk',
                chunk: base64Chunk,
                chunkIndex: data.chunkIndex
              }));
            } else {
              channel.send(JSON.stringify(data));
            }
          } else {
            channel.send(data);
          }
        },
        get bufferedAmount() {
          return channel.bufferedAmount || 0;
        }
      };

      channel.onopen = () => {
        logSystem(`Connected via QR Handshake! (${peerId})`);
        addConnection(peerId, connWrapper);
        document.getElementById('qr-section').style.display = 'none';
      };

      channel.onmessage = (e) => {
        let data = e.data;
        if (typeof data === 'string') {
          try {
            const parsed = JSON.parse(data);
            if (parsed.type === 'file-chunk' && typeof parsed.chunk === 'string') {
              const binary = atob(parsed.chunk);
              const bytes = new Uint8Array(binary.length);
              for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
              }
              parsed.chunk = bytes.buffer;
            }
            processIncomingData(parsed, peerId);
            return;
          } catch(err) {
            processIncomingData(data, peerId);
            return;
          }
        }
        processIncomingData(data, peerId);
      };

      channel.onclose = () => removeConnection(peerId);
      channel.onerror = () => removeConnection(peerId);
    }

    async function startAsHost() {
      hideQR();
      stopScanner();
      setQRStatus("Gathering local network candidates...");

      nativePc = new RTCPeerConnection(rtcConfig);
      const channel = nativePc.createDataChannel("chat");
      const hostPeerId = "QR-Peer-" + Math.random().toString(36).substring(2, 6);

      setupNativeDataChannel(channel, hostPeerId);

      const offer = await nativePc.createOffer();
      await nativePc.setLocalDescription(offer);

      nativePc.onicegatheringstatechange = () => {
        if (nativePc.iceGatheringState === 'complete') {
          displayQR(JSON.stringify(nativePc.localDescription));
          setQRStatus("Step 1: Scan this Offer QR using Device B. Then click below to scan Answer.");
          showQRActionButton("Scan Device B's Answer QR", scanAnswerQR);
        }
      };
    }

    function scanAnswerQR() {
      hideQR();
      setQRStatus("Step 2: Point camera at Device B's Answer QR code...");
      startScanner(async (scannedAnswer) => {
        stopScanner();
        try {
          const answerSDP = JSON.parse(scannedAnswer);
          await nativePc.setRemoteDescription(answerSDP);
          setQRStatus("Establishing direct WebRTC connection...");
        } catch (e) {
          alert("Invalid Answer QR code.");
        }
      });
    }

    function startAsJoiner() {
      hideQR();
      stopScanner();
      setQRStatus("Step 1: Point camera at Device A's Offer QR code...");

      startScanner(async (scannedOffer) => {
        stopScanner();
        setQRStatus("Processing Offer & Gathering Answer Candidates...");

        try {
          nativePc = new RTCPeerConnection(rtcConfig);
          const joinerPeerId = "QR-Peer-" + Math.random().toString(36).substring(2, 6);

          nativePc.ondatachannel = (e) => {
            setupNativeDataChannel(e.channel, joinerPeerId);
          };

          const offerSDP = JSON.parse(scannedOffer);
          await nativePc.setRemoteDescription(offerSDP);

          const answer = await nativePc.createAnswer();
          await nativePc.setLocalDescription(answer);

          nativePc.onicegatheringstatechange = () => {
            if (nativePc.iceGatheringState === 'complete') {
              displayQR(JSON.stringify(nativePc.localDescription));
              setQRStatus("Step 2: Display this Answer QR code to Device A.");
            }
          };
        } catch (e) {
          alert("Invalid Offer QR code.");
        }
      });
    }

    // ==========================================
    // INCOMING DATA PROCESSING
    // ==========================================
    function processIncomingData(data, senderPeerId) {
      const conn = connections.get(senderPeerId);
      const senderName = (conn && conn.name) ? conn.name : senderPeerId;

      if (typeof data === 'string') {
        logMessage(senderName, data);
        return;
      }

      if (data.type === 'identity') {
        if (conn) {
          conn.name = data.name;
          knownConnectedNames.add(data.name); // Track for refresh auto-reconnect
          updateConnectedPeersBar();
          logSystem(`${senderPeerId} updated name to "${data.name}"`);
        }
        return;
      }

      if (data.type === 'file-header') {
        incomingTransfers.set(senderPeerId, {
          filename: data.filename,
          filetype: data.filetype,
          filesize: data.filesize,
          totalChunks: data.totalChunks,
          chunks: [],
          receivedBytes: 0
        });
        logDebug(`Receiving file from ${senderName}: ${data.filename} (${Math.round(data.filesize / 1024)} KB)`);
      } else if (data.type === 'file-chunk') {
        const transfer = incomingTransfers.get(senderPeerId);
        if (transfer) {
          transfer.chunks.push(data.chunk);
          transfer.receivedBytes += (data.chunk.byteLength || data.chunk.size || 0);
          const percent = Math.round((transfer.receivedBytes / transfer.filesize) * 100);
          
          if (percent % 25 === 0 || percent === 100) {
            logDebug(`Downloading from ${senderName} (${transfer.filename}): ${percent}%`);
          }
        }
      } else if (data.type === 'file-complete') {
        const transfer = incomingTransfers.get(senderPeerId);
        if (transfer) {
          const blob = new Blob(transfer.chunks, { type: transfer.filetype });
          const downloadUrl = URL.createObjectURL(blob);
          
          logDownloadLink(senderName, downloadUrl, transfer.filename);
          incomingTransfers.delete(senderPeerId);
        }
      }
    }

    // ==========================================
    // CAMERA SCANNER & QR HELPERS
    // ==========================================
    function startScanner(onScanSuccess) {
      const video = document.getElementById("webcam");
      const canvasElement = document.getElementById("video-canvas");
      const canvas = canvasElement.getContext("2d", { willReadFrequently: true });

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Camera API blocked! Mobile browsers require HTTPS or localhost to access the camera.");
        return;
      }

      const requestCamera = (constraints) => navigator.mediaDevices.getUserMedia(constraints);

      requestCamera({ video: { facingMode: "environment" } })
        .catch(() => requestCamera({ video: true }))
        .then(async (stream) => {
          scanStream = stream;
          video.srcObject = stream;
          video.removeAttribute("hidden");

          try {
            await video.play();
          } catch (err) {
            console.warn("Video play error:", err);
          }

          function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
              canvasElement.height = video.videoHeight;
              canvasElement.width = video.videoWidth;
              canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);

              const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
              const code = jsQR(imageData.data, imageData.width, imageData.height);

              if (code && code.data) {
                onScanSuccess(code.data);
                return;
              }
            }
            if (scanStream) requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        })
        .catch((err) => {
          alert(`Camera Permission or Device Error: ${err.name} - ${err.message}`);
        });
    }

    function stopScanner() {
      if (scanStream) {
        scanStream.getTracks().forEach(track => track.stop());
        scanStream = null;
      }
      document.getElementById("webcam").setAttribute("hidden", true);
    }

    function displayQR(data) {
      const canvas = document.getElementById('qr-canvas');
      qrGen.value = data;
      canvas.style.display = 'block';
    }

    function hideQR() { document.getElementById('qr-canvas').style.display = 'none'; }
    function setQRStatus(txt) { document.getElementById('qr-status').innerText = txt; }
    
    function showQRActionButton(label, onClick) {
      const btn = document.getElementById('qr-action-btn');
      btn.innerText = label;
      btn.style.display = 'block';
      btn.onclick = () => {
        btn.style.display = 'none';
        onClick();
      };
    }

    // ==========================================
    // SEND CONTROLS & UTILITIES
    // ==========================================
    document.getElementById('send-btn').addEventListener('click', () => {
      const input = document.getElementById('msg-input');
      const val = input.value.trim();
      if (val && connections.size > 0) {
        broadcastData(val);
        logMessage('You', val);
        input.value = '';
      }
    });

    document.getElementById('send-file-btn').addEventListener('click', async () => {
      const fileInput = document.getElementById('file-input');
      const file = fileInput.files[0];
      
      if (file && connections.size > 0) {
        const sendBtn = document.getElementById('send-file-btn');
        sendBtn.disabled = true;
        logSystem(`Sending file: ${file.name} (${Math.round(file.size / 1024)} KB) to all peers...`);

        await sendFileInChunks(file);
        
        logSystem(`Finished sending ${file.name}`);
        fileInput.value = '';
        sendBtn.disabled = false;
      }
    });

    async function sendFileInChunks(file) {
      const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

      broadcastData({
        type: 'file-header',
        filename: file.name,
        filetype: file.type,
        filesize: file.size,
        totalChunks: totalChunks
      });

      let offset = 0;
      let chunkIndex = 0;

      while (offset < file.size) {
        let maxBuffer = 0;
        connections.forEach(c => {
          if (c.bufferedAmount > maxBuffer) maxBuffer = c.bufferedAmount;
        });

        if (maxBuffer > 1024 * 1024) {
          await new Promise((resolve) => setTimeout(resolve, 50));
          continue;
        }

        const chunkBlob = file.slice(offset, offset + CHUNK_SIZE);
        const buffer = await chunkBlob.arrayBuffer();

        broadcastData({
          type: 'file-chunk',
          chunk: buffer,
          chunkIndex: chunkIndex
        });

        offset += CHUNK_SIZE;
        chunkIndex++;
      }

      broadcastData({ type: 'file-complete' });
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function logMessage(sender, text) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `<strong>${escapeHTML(sender)}:</strong> ${escapeHTML(text)}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function logSystem(text) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `<em>System: ${escapeHTML(text)}</em>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function logDebug(text) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'debug-log';
      div.textContent = `🛠 ${text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function logDownloadLink(sender, url, filename) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'message';
      
      const label = document.createElement('strong');
      label.textContent = `${sender}: `;
      
      const link = document.createElement('a');
      link.className = 'download-link';
      link.href = url;
      link.download = filename;
      link.textContent = `Download ${filename}`;

      link.addEventListener('click', () => {
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      });
      
      div.appendChild(label);
      div.appendChild(link);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
