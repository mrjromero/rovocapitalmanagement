<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PeerJS Serverless Chat</title>
  <!-- Load PeerJS from jsDelivr CDN -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    #chat-box { height: 300px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; margin: 10px 0; background: #f9f9f9;}
    .controls { display: flex; gap: 5px; margin-bottom: 10px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Peer-to-Peer Chat</h2>
  
  <p><strong>Your ID:</strong> <span id="my-id">Generating...</span></p>
  
  <div class="controls">
    <input type="text" id="remote-id" placeholder="Enter friend's ID">
    <button id="connect-btn">Connect</button>
  </div>
  
  <div id="chat-box"></div>
  
  <div class="controls">
    <input type="text" id="msg-input" placeholder="Type a message..." disabled>
    <button id="send-btn" disabled>Send</button>
  </div>

  <script>
    // 1. Initialize PeerJS (defaults to the free cloud signaling server)
    const peer = new Peer(); 
    let activeConnection;

    // Display the random ID assigned to us by the server
    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
    });

    // 2. Listen for INCOMING connection requests
    peer.on('connection', (conn) => {
      handleConnection(conn);
    });

    // 3. Initiate an OUTGOING connection
    document.getElementById('connect-btn').addEventListener('click', () => {
      const remoteId = document.getElementById('remote-id').value;
      if (!remoteId) return;
      
      const conn = peer.connect(remoteId);
      handleConnection(conn);
    });

    // 4. Setup message sending and receiving logic for both peers
    function handleConnection(conn) {
      activeConnection = conn;
      
      conn.on('open', () => {
        log(`System: Connected to ${conn.peer}`);
        document.getElementById('msg-input').disabled = false;
        document.getElementById('send-btn').disabled = false;
      });

      conn.on('data', (data) => {
        log(`Friend: ${data}`);
      });
    }

    // 5. Send message on button click
    document.getElementById('send-btn').addEventListener('click', () => {
      const input = document.getElementById('msg-input');
      const msg = input.value;
      
      if (msg && activeConnection) {
        activeConnection.send(msg); // Send directly via WebRTC DataChannel
        log(`You: ${msg}`);
        input.value = '';
      }
    });

    // Helper to print messages to the screen
    function log(text) {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div>${text}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
