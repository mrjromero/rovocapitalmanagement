<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeerJS File Transfer</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <style>
    :root {
      --primary: #007bff;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --border: #dcdcdc;
    }
    
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background-color: var(--bg);
      margin: 0; 
      padding: 15px; 
      display: flex;
      justify-content: center;
    }

    .app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      padding: 20px;
      box-sizing: border-box;
    }

    h2 { margin-top: 0; font-size: 1.5rem; text-align: center; }

    .id-container {
      background: #e9ecef;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
      word-break: break-all;
    }

    .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    
    input[type="text"], input[type="file"] { 
      flex: 1; 
      min-width: 150px;
      padding: 12px; 
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px; 
      box-sizing: border-box;
    }
    
    button { 
      padding: 12px 16px; 
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer; 
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    
    button:disabled { background-color: #a0cbf5; cursor: not-allowed; }
    button:active { opacity: 0.8; }
    
    .copy-btn { padding: 6px 12px; font-size: 14px; border-radius: 6px; }
    
    #chat-box { 
      height: 40vh; 
      min-height: 250px;
      border: 1px solid var(--border); 
      border-radius: 8px;
      overflow-y: auto; 
      padding: 12px; 
      margin: 15px 0; 
      background: #fafafa;
      word-wrap: break-word;
    }
    
    .message { margin-bottom: 8px; line-height: 1.4; }
    
    /* New CSS class for debug logs */
    .debug-log { 
      margin-bottom: 8px; 
      font-size: 0.85em; 
      color: #6c757d; 
      font-family: monospace; 
    }
    
    a.download-link { color: var(--primary); font-weight: bold; text-decoration: none; word-break: break-all; }
    a.download-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="app-container">
    <h2>P2P Transfer</h2>
    
    <div class="id-container">
      <span><strong>Your ID:</strong> <span id="my-id">Generating...</span></span>
      <button id="share-btn" class="copy-btn" disabled>Share Link</button>
    </div>
    
    <div class="controls">
      <input type="text" id="remote-id" placeholder="Enter friend's ID">
      <button id="connect-btn">Connect</button>
    </div>
    
    <div id="chat-box"></div>
    
    <div class="controls">
      <input type="text" id="msg-input" placeholder="Type a message..." disabled>
      <button id="send-btn" disabled>Send</button>
    </div>

    <div class="controls">
      <input type="file" id="file-input" disabled>
      <button id="send-file-btn" disabled>Send File</button>
    </div>
  </div>

  <script>
    const peer = new Peer({
      config: {
        'iceServers': [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
          { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
          { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
        ]
      }
    }); 
    
    let activeConnection;

    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('id');

    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
      
      const shareBtn = document.getElementById('share-btn');
      shareBtn.disabled = false;
      const shareUrl = `${window.location.origin}${window.location.pathname}?id=${id}`;
      
      shareBtn.addEventListener('click', async () => {
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'Send files securely',
              text: 'Tap this link to connect directly to my device:',
              url: shareUrl
            });
          } catch (err) {
            console.log('User cancelled share or share failed', err);
          }
        } else {
          navigator.clipboard.writeText(shareUrl).then(() => {
            const originalText = shareBtn.innerText;
            shareBtn.innerText = 'Link Copied!';
            setTimeout(() => { shareBtn.innerText = originalText; }, 2000);
          }).catch(err => console.error('Failed to copy: ', err));
        }
      });

      if (targetPeerId) {
        document.getElementById('remote-id').value = targetPeerId;
        log(`<em>System: Auto-connecting to link...</em>`);
        setTimeout(() => { handleConnection(peer.connect(targetPeerId)); }, 500);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });

    peer.on('connection', (conn) => {
      handleConnection(conn);
    });

    document.getElementById('connect-btn').addEventListener('click', () => {
      const remoteId = document.getElementById('remote-id').value;
      if (!remoteId) return;
      handleConnection(peer.connect(remoteId));
    });

    function handleConnection(conn) {
      activeConnection = conn;
      
      // === NEW: Extract the underlying WebRTC Connection for Debugging ===
      // PeerJS instantiates the raw WebRTC object shortly after connection creation
      const pollPc = setInterval(() => {
        if (conn.peerConnection) {
          clearInterval(pollPc);
          const pc = conn.peerConnection;
          
          logDebug('Network negotiation started...');

          // 1. Listen for connection state changes (checking, connected, failed)
          pc.addEventListener('iceconnectionstatechange', () => {
            logDebug(`Status updated: <strong>${pc.iceConnectionState.toUpperCase()}</strong>`);
          });

          // 2. Listen for route discoveries (Host, STUN, TURN)
          pc.addEventListener('icecandidate', (event) => {
            if (event.candidate) {
              const candidateStr = event.candidate.candidate;
              let routeType = "Unknown Route";
              
              if (candidateStr.includes('typ host')) routeType = "Local Network (Host)";
              else if (candidateStr.includes('typ srflx')) routeType = "Public IP (STUN)";
              else if (candidateStr.includes('typ relay')) routeType = "Cloud Relay (TURN)";
              
              logDebug(`Found potential path: <strong>${routeType}</strong>`);
            }
          });
        }
      }, 50);
      // ===================================================================

      conn.on('open', () => {
        log(`<em>System: Connected to ${conn.peer}</em>`);
        document.getElementById('msg-input').disabled = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('file-input').disabled = false;
        document.getElementById('send-file-btn').disabled = false;
      });

      conn.on('data', (data) => {
        if (data.type === 'file') {
          const blob = new Blob([data.file], { type: data.filetype });
          const downloadUrl = URL.createObjectURL(blob);
          log(`<strong>Friend:</strong> <a class="download-link" href="${downloadUrl}" download="${data.filename}">Download ${data.filename}</a>`);
        } else {
          log(`<strong>Friend:</strong> ${data}`);
        }
      });
    }

    document.getElementById('send-btn').addEventListener('click', () => {
      const input = document.getElementById('msg-input');
      if (input.value && activeConnection) {
        activeConnection.send(input.value);
        log(`<strong>You:</strong> ${input.value}`);
        input.value = '';
      }
    });

    document.getElementById('send-file-btn').addEventListener('click', () => {
      const fileInput = document.getElementById('file-input');
      const file = fileInput.files[0];
      
      if (file && activeConnection) {
        log(`<strong>You sent:</strong> ${file.name} (${Math.round(file.size / 1024)} KB)`);
        
        activeConnection.send({
          type: 'file',
          file: file,
          filename: file.name,
          filetype: file.type
        });
        
        fileInput.value = '';
      }
    });

    // Helper for main chat logs
    function log(text) {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div class="message">${text}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    
    // Helper for smaller, grey debugging logs
    function logDebug(text) {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div class="debug-log">🛠 ${text}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
