<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>P2P File Transfer & Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <style>
    :root {
      --primary: #007bff;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --border: #dcdcdc;
    }
    
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background-color: var(--bg);
      margin: 0; 
      padding: 15px; 
      display: flex;
      justify-content: center;
    }

    .app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      padding: 20px;
      box-sizing: border-box;
    }

    h2 { margin-top: 0; font-size: 1.5rem; text-align: center; }

    .id-container {
      background: #e9ecef;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
      word-break: break-all;
    }

    .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    
    input[type="text"], input[type="file"] { 
      flex: 1; 
      min-width: 150px;
      padding: 12px; 
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px; 
      box-sizing: border-box;
    }
    
    button { 
      padding: 12px 16px; 
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer; 
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    
    button:disabled { background-color: #a0cbf5; cursor: not-allowed; }
    button:active { opacity: 0.8; }
    
    .copy-btn { padding: 6px 12px; font-size: 14px; border-radius: 6px; }
    
    #chat-box { 
      height: 40vh; 
      min-height: 250px;
      border: 1px solid var(--border); 
      border-radius: 8px;
      overflow-y: auto; 
      padding: 12px; 
      margin: 15px 0; 
      background: #fafafa;
      word-wrap: break-word;
    }
    
    .message { margin-bottom: 8px; line-height: 1.4; }
    
    .debug-log { 
      margin-bottom: 8px; 
      font-size: 0.85em; 
      color: #6c757d; 
      font-family: monospace; 
    }
    
    a.download-link { color: var(--primary); font-weight: bold; text-decoration: none; word-break: break-all; }
    a.download-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="app-container">
    <h2>P2P Transfer</h2>
    
    <div class="id-container">
      <span><strong>Your ID:</strong> <span id="my-id">Generating...</span></span>
      <button id="share-btn" class="copy-btn" disabled>Share Link</button>
    </div>
    
    <div class="controls">
      <input type="text" id="remote-id" placeholder="Enter friend's ID">
      <button id="connect-btn">Connect</button>
    </div>
    
    <div id="chat-box"></div>
    
    <div class="controls">
      <input type="text" id="msg-input" placeholder="Type a message..." disabled>
      <button id="send-btn" disabled>Send</button>
    </div>

    <div class="controls">
      <input type="file" id="file-input" disabled>
      <button id="send-file-btn" disabled>Send File</button>
    </div>
  </div>

  <script>
    const CHUNK_SIZE = 16384; // 16 KB safe chunk size
    let activeConnection;
    let incomingTransfer = null;

    const peer = new Peer({
      config: {
        'iceServers': [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
          { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
          { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
        ]
      }
    }); 

    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('id');

    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
      
      const shareBtn = document.getElementById('share-btn');
      shareBtn.disabled = false;
      const shareUrl = `${window.location.origin}${window.location.pathname}?id=${id}`;
      
      shareBtn.addEventListener('click', async () => {
        if (navigator.share) {
          try {
            await navigator.share({ url: shareUrl });
          } catch (err) {
            console.log('User cancelled share or share failed', err);
          }
        } else {
          navigator.clipboard.writeText(shareUrl).then(() => {
            const originalText = shareBtn.innerText;
            shareBtn.innerText = 'Link Copied!';
            setTimeout(() => { shareBtn.innerText = originalText; }, 2000);
          }).catch(err => console.error('Failed to copy: ', err));
        }
      });

      if (targetPeerId) {
        document.getElementById('remote-id').value = targetPeerId;
        logSystem('Auto-connecting to link...');
        setTimeout(() => { handleConnection(peer.connect(targetPeerId)); }, 500);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });

    peer.on('connection', (conn) => {
      handleConnection(conn);
    });

    document.getElementById('connect-btn').addEventListener('click', () => {
      const remoteId = document.getElementById('remote-id').value.trim();
      if (!remoteId) return;
      handleConnection(peer.connect(remoteId));
    });

    function handleConnection(conn) {
      activeConnection = conn;
      
      const pollPc = setInterval(() => {
        if (conn.peerConnection) {
          clearInterval(pollPc);
          const pc = conn.peerConnection;
          
          logDebug('Network negotiation started...');

          pc.addEventListener('iceconnectionstatechange', () => {
            logDebug(`Status updated: ${pc.iceConnectionState.toUpperCase()}`);
          });

          pc.addEventListener('icecandidate', (event) => {
            if (event.candidate) {
              const candidateStr = event.candidate.candidate;
              let routeType = "Unknown Route";
              
              if (candidateStr.includes('typ host')) routeType = "Local Network (Host)";
              else if (candidateStr.includes('typ srflx')) routeType = "Public IP (STUN)";
              else if (candidateStr.includes('typ relay')) routeType = "Cloud Relay (TURN)";
              
              logDebug(`Found potential path: ${routeType}`);
            }
          });
        }
      }, 50);

      conn.on('open', () => {
        logSystem(`Connected to ${conn.peer}`);
        document.getElementById('msg-input').disabled = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('file-input').disabled = false;
        document.getElementById('send-file-btn').disabled = false;
      });

      conn.on('data', (data) => {
        // Standard text message
        if (typeof data === 'string') {
          logMessage('Friend', data);
          return;
        }

        // Chunked file transfer protocol
        if (data.type === 'file-header') {
          incomingTransfer = {
            filename: data.filename,
            filetype: data.filetype,
            filesize: data.filesize,
            totalChunks: data.totalChunks,
            chunks: [],
            receivedBytes: 0
          };
          logDebug(`Receiving file: ${data.filename} (${Math.round(data.filesize / 1024)} KB)`);
        } else if (data.type === 'file-chunk' && incomingTransfer) {
          incomingTransfer.chunks.push(data.chunk);
          incomingTransfer.receivedBytes += data.chunk.byteLength;
          const percent = Math.round((incomingTransfer.receivedBytes / incomingTransfer.filesize) * 100);
          
          if (percent % 25 === 0 || percent === 100) {
            logDebug(`Downloading ${incomingTransfer.filename}: ${percent}%`);
          }
        } else if (data.type === 'file-complete' && incomingTransfer) {
          const blob = new Blob(incomingTransfer.chunks, { type: incomingTransfer.filetype });
          const downloadUrl = URL.createObjectURL(blob);
          
          logDownloadLink('Friend', downloadUrl, incomingTransfer.filename);
          incomingTransfer = null;
        }
      });
    }

    // Send text message safely
    document.getElementById('send-btn').addEventListener('click', () => {
      const input = document.getElementById('msg-input');
      const val = input.value.trim();
      if (val && activeConnection) {
        activeConnection.send(val);
        logMessage('You', val);
        input.value = '';
      }
    });

    // Send file in chunks with backpressure management
    document.getElementById('send-file-btn').addEventListener('click', async () => {
      const fileInput = document.getElementById('file-input');
      const file = fileInput.files[0];
      
      if (file && activeConnection) {
        const sendBtn = document.getElementById('send-file-btn');
        sendBtn.disabled = true;
        logSystem(`Sending file: ${file.name} (${Math.round(file.size / 1024)} KB)...`);

        await sendFileInChunks(file, activeConnection);
        
        logSystem(`Finished sending ${file.name}`);
        fileInput.value = '';
        sendBtn.disabled = false;
      }
    });

    async function sendFileInChunks(file, conn) {
      const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

      conn.send({
        type: 'file-header',
        filename: file.name,
        filetype: file.type,
        filesize: file.size,
        totalChunks: totalChunks
      });

      let offset = 0;
      let chunkIndex = 0;

      while (offset < file.size) {
        // Backpressure check to prevent buffer overflow
        if (conn.dataChannel && conn.dataChannel.bufferedAmount > 1024 * 1024) {
          await new Promise((resolve) => setTimeout(resolve, 50));
          continue;
        }

        const chunkBlob = file.slice(offset, offset + CHUNK_SIZE);
        const buffer = await chunkBlob.arrayBuffer();

        conn.send({
          type: 'file-chunk',
          chunk: buffer,
          chunkIndex: chunkIndex
        });

        offset += CHUNK_SIZE;
        chunkIndex++;
      }

      conn.send({ type: 'file-complete' });
    }

    // Sanitized HTML rendering functions to block XSS
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function logMessage(sender, text) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `<strong>${escapeHTML(sender)}:</strong> ${escapeHTML(text)}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function logSystem(text) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `<em>System: ${escapeHTML(text)}</em>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function logDebug(text) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'debug-log';
      div.textContent = `🛠 ${text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function logDownloadLink(sender, url, filename) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'message';
      
      const label = document.createElement('strong');
      label.textContent = `${sender}: `;
      
      const link = document.createElement('a');
      link.className = 'download-link';
      link.href = url;
      link.download = filename;
      link.textContent = `Download ${filename}`;

      // Revoke URL memory after download trigger
      link.addEventListener('click', () => {
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      });
      
      div.appendChild(label);
      div.appendChild(link);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
