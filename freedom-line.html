<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom Line Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 1000px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }
        input {
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            font-size: 1rem;
            color: #2d3748;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3182ce;
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
        .summary-box {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding: 15px;
            background: #ebf8ff;
            border-radius: 8px;
            border: 1px solid #bee3f8;
        }
        .summary-item {
            text-align: center;
        }
        .summary-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: #2b6cb0;
        }
        .summary-label {
            font-size: 0.85rem;
            color: #4a5568;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Freedom Line™ Simulator</h2>
    
    <div class="controls">
        <div class="input-group">
            <label for="initialIncome">Desired Annual Income ($)</label>
            <input type="number" id="initialIncome" value="120000" step="1000" oninput="calculateAndRender()">
        </div>
        <div class="input-group">
            <label for="icr">Income Coverage Ratio (ICR)</label>
            <input type="number" id="icr" value="1.25" step="0.05" oninput="calculateAndRender()">
        </div>
        <div class="input-group">
            <label for="yieldRate">Portfolio Yield (%)</label>
            <input type="number" id="yieldRate" value="6" step="0.1" oninput="calculateAndRender()">
        </div>
        <div class="input-group">
            <label for="inflationRate">Annual Inflation (%)</label>
            <input type="number" id="inflationRate" value="5" step="0.1" oninput="calculateAndRender()">
        </div>
        <div class="input-group">
            <label for="months">Months to Simulate</label>
            <input type="number" id="months" value="60" step="12" min="1" max="600" oninput="calculateAndRender()">
        </div>
    </div>

    <div class="chart-container">
        <canvas id="freedomChart"></canvas>
    </div>

    <div class="summary-box">
        <div class="summary-item">
            <div class="summary-label">Starting Asset Requirement</div>
            <div class="summary-value" id="startAssets">$0.00</div>
        </div>
        <div class="summary-item">
            <div class="summary-label">Ending Asset Requirement</div>
            <div class="summary-value" id="endAssets">$0.00</div>
        </div>
        <div class="summary-item">
            <div class="summary-label">Additional Capital Needed</div>
            <div class="summary-value" id="assetGap">$0.00</div>
        </div>
    </div>
</div>

<script>
    let freedomChartInstance = null;

    // Formats numbers as standard USD currency
    const formatter = new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
    });

    function calculateAndRender() {
        // Fetch values from inputs
        const initialIncome = parseFloat(document.getElementById('initialIncome').value) || 0;
        const icr = parseFloat(document.getElementById('icr').value) || 0;
        const yieldRate = parseFloat(document.getElementById('yieldRate').value) / 100 || 0;
        const inflationRate = parseFloat(document.getElementById('inflationRate').value) / 100 || 0;
        const months = parseInt(document.getElementById('months').value) || 0;

        const labels = [];
        const requiredAssetsData = [];
        const targetPassiveIncomeData = [];

        // Calculate compounding on a monthly basis
        for (let m = 0; m <= months; m++) {
            labels.push(`Month ${m}`);
            
            // Continuous monthly calculation based on annual inflation rate
            // Formula: Initial * (1 + inflation)^(months / 12)
            const currentDesiredIncome = initialIncome * Math.pow(1 + inflationRate, m / 12);
            
            const targetPassiveIncome = currentDesiredIncome * icr;
            const requiredAssets = targetPassiveIncome / yieldRate;

            targetPassiveIncomeData.push(targetPassiveIncome);
            requiredAssetsData.push(requiredAssets);
        }

        updateSummaryBoxes(requiredAssetsData);
        drawChart(labels, requiredAssetsData);
    }

    function updateSummaryBoxes(assetsArray) {
        if (assetsArray.length === 0) return;
        const start = assetsArray[0];
        const end = assetsArray[assetsArray.length - 1];
        const gap = end - start;

        document.getElementById('startAssets').innerText = formatter.format(start);
        document.getElementById('endAssets').innerText = formatter.format(end);
        document.getElementById('assetGap').innerText = formatter.format(gap);
    }

    function drawChart(labels, assetsData) {
        const ctx = document.getElementById('freedomChart').getContext('2d');

        if (freedomChartInstance) {
            freedomChartInstance.destroy(); // Destroy previous chart instance before redrawing
        }

        freedomChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Required Income Assets',
                    data: assetsData,
                    borderColor: '#2b6cb0',
                    backgroundColor: 'rgba(43, 108, 176, 0.1)',
                    borderWidth: 3,
                    pointRadius: 2,
                    pointBackgroundColor: '#2b6cb0',
                    fill: true,
                    tension: 0.4 // Gives the line a smooth curve
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return 'Required Assets: ' + formatter.format(context.parsed.y);
                            }
                        }
                    },
                    legend: {
                        display: true,
                        position: 'top',
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        ticks: {
                            callback: function(value) {
                                return formatter.format(value);
                            }
                        },
                        title: {
                            display: true,
                            text: 'Capital Required ($)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Timeline (Months)'
                        },
                        ticks: {
                            maxTicksLimit: 12 // Prevents overcrowding on the X-axis
                        }
                    }
                }
            }
        });
    }

    // Initialize the app on first load
    window.onload = calculateAndRender;
</script>

</body>
</html>
