<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volatile Freedom Line Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 1000px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }
        input {
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            font-size: 1rem;
            color: #2d3748;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3182ce;
        }
        .btn-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        button {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2c5282;
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
        .summary-box {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding: 15px;
            background: #ebf8ff;
            border-radius: 8px;
            border: 1px solid #bee3f8;
        }
        .summary-item {
            text-align: center;
        }
        .summary-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: #2b6cb0;
        }
        .summary-label {
            font-size: 0.85rem;
            color: #4a5568;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>
        Freedom Line™ Stress Test
        <span style="font-size: 0.9rem; font-weight: normal; color: #718096;">Stochastic Volatility Model</span>
    </h2>
    
    <div class="controls">
        <div class="input-group">
            <label for="initialIncome">Desired Income ($)</label>
            <input type="number" id="initialIncome" value="120000" step="1000">
        </div>
        <div class="input-group">
            <label for="icr">Income Coverage Ratio</label>
            <input type="number" id="icr" value="1.25" step="0.05">
        </div>
        <div class="input-group">
            <label for="yieldRate">Portfolio Yield (%)</label>
            <input type="number" id="yieldRate" value="6" step="0.1">
        </div>
        <div class="input-group">
            <label for="inflationRate">Avg Annual Inflation (%)</label>
            <input type="number" id="inflationRate" value="5" step="0.1">
        </div>
        <div class="input-group">
            <label for="volatilityRate">Inflation Volatility (Std Dev %)</label>
            <input type="number" id="volatilityRate" value="2.5" step="0.1">
        </div>
        <div class="input-group">
            <label for="months">Months to Simulate</label>
            <input type="number" id="months" value="60" step="12" min="1" max="600">
        </div>
    </div>

    <div class="btn-container">
        <button onclick="calculateAndRender()">Re-Run Simulation</button>
    </div>

    <div class="chart-container">
        <canvas id="freedomChart"></canvas>
    </div>

    <div class="summary-box">
        <div class="summary-item">
            <div class="summary-label">Starting Asset Requirement</div>
            <div class="summary-value" id="startAssets">$0.00</div>
        </div>
        <div class="summary-item">
            <div class="summary-label">Ending Asset Requirement</div>
            <div class="summary-value" id="endAssets">$0.00</div>
        </div>
        <div class="summary-item">
            <div class="summary-label">Realized Effective Inflation</div>
            <div class="summary-value" id="effectiveInflation">0.00%</div>
        </div>
    </div>
</div>

<script>
    let freedomChartInstance = null;

    // Formats numbers as standard USD currency
    const formatter = new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
    });

    // Box-Muller transform to generate normally distributed random numbers
    function randomNormal(mean, stdDev) {
        let u1 = Math.random();
        let u2 = Math.random();
        let z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
        return z0 * stdDev + mean;
    }

    function calculateAndRender() {
        const initialIncome = parseFloat(document.getElementById('initialIncome').value) || 0;
        const icr = parseFloat(document.getElementById('icr').value) || 0;
        const yieldRate = parseFloat(document.getElementById('yieldRate').value) / 100 || 0;
        
        // Convert annual metrics to monthly for iterative calculation
        const annualInflationMean = parseFloat(document.getElementById('inflationRate').value) / 100 || 0;
        const annualVolatility = parseFloat(document.getElementById('volatilityRate').value) / 100 || 0;
        
        const monthlyInflationMean = annualInflationMean / 12;
        const monthlyVolatility = annualVolatility / Math.sqrt(12); // Scale standard deviation to monthly
        
        const months = parseInt(document.getElementById('months').value) || 0;

        const labels = [];
        const requiredAssetsData = [];
        
        let currentIncome = initialIncome;

        // Iterative monthly calculation with randomized volatility
        for (let m = 0; m <= months; m++) {
            labels.push(`Month ${m}`);
            
            if (m > 0) {
                // Apply a randomized inflation rate for this specific month
                let monthlyShock = randomNormal(monthlyInflationMean, monthlyVolatility);
                currentIncome = currentIncome * (1 + monthlyShock);
            }
            
            const targetPassiveIncome = currentIncome * icr;
            const requiredAssets = targetPassiveIncome / yieldRate;

            requiredAssetsData.push(requiredAssets);
        }

        // Calculate the actual realized inflation over the entire simulation
        const endingIncome = currentIncome;
        const totalGrowthMultiplier = endingIncome / initialIncome;
        const annualizedRealizedInflation = (Math.pow(totalGrowthMultiplier, 12 / months) - 1) * 100;

        updateSummaryBoxes(requiredAssetsData, annualizedRealizedInflation);
        drawChart(labels, requiredAssetsData);
    }

    function updateSummaryBoxes(assetsArray, realizedInflation) {
        if (assetsArray.length === 0) return;
        const start = assetsArray[0];
        const end = assetsArray[assetsArray.length - 1];

        document.getElementById('startAssets').innerText = formatter.format(start);
        document.getElementById('endAssets').innerText = formatter.format(end);
        document.getElementById('effectiveInflation').innerText = realizedInflation.toFixed(2) + '%';
    }

    function drawChart(labels, assetsData) {
        const ctx = document.getElementById('freedomChart').getContext('2d');

        if (freedomChartInstance) {
            freedomChartInstance.destroy();
        }

        freedomChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Required Assets (Volatile Scenario)',
                    data: assetsData,
                    borderColor: '#e53e3e',
                    backgroundColor: 'rgba(229, 62, 62, 0.1)',
                    borderWidth: 2,
                    pointRadius: 0, 
                    fill: true,
                    tension: 0.1 // Kept low to show the jagged, real-world volatility
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return 'Required Assets: ' + formatter.format(context.parsed.y);
                            }
                        }
                    },
                    legend: {
                        display: true,
                        position: 'top',
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        ticks: {
                            callback: function(value) {
                                return formatter.format(value);
                            }
                        },
                        title: {
                            display: true,
                            text: 'Capital Required ($)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Timeline (Months)'
                        },
                        ticks: {
                            maxTicksLimit: 12
                        }
                    }
                }
            }
        });
    }

    // Initialize on first load
    window.onload = calculateAndRender;
</script>

</body>
</html>
