<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Positive Carry | Level 1: The Basics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Level 1: The Income Engine</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-4">
                <div><label class="block text-sm font-bold">Total Assets ($)</label><input type="number" id="assets" class="w-full p-2 border rounded" value="100000" oninput="update()"></div>
                <div><label class="block text-sm font-bold">Borrowed Amount ($)</label><input type="number" id="debt" class="w-full p-2 border rounded" value="25000" oninput="update()"></div>
                <div><label class="block text-sm font-bold">Asset Yield (%)</label><input type="number" id="yield" class="w-full p-2 border rounded" value="10" oninput="update()"></div>
                <div><label class="block text-sm font-bold">Loan Interest Rate (%)</label><input type="number" id="interest" class="w-full p-2 border rounded" value="6" oninput="update()"></div>
            </div>

            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <h2 class="text-lg font-semibold mb-4">Annual Cash Flow</h2>
                <div class="space-y-2 text-lg">
                    <div class="flex justify-between"><span>Yield Income:</span> <span id="outIncome" class="font-bold">$0</span></div>
                    <div class="flex justify-between"><span>Loan Cost:</span> <span id="outCost" class="font-bold text-rose-500">$0</span></div>
                    <hr>
                    <div class="flex justify-between"><span>Net Carry:</span> <span id="outNet" class="font-bold text-emerald-600">$0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function update() {
            const assets = parseFloat(document.getElementById('assets').value) || 0;
            const debt = parseFloat(document.getElementById('debt').value) || 0;
            const yieldR = (parseFloat(document.getElementById('yield').value) || 0) / 100;
            const interestR = (parseFloat(inputs.interest.value) || 0) / 100;

            const income = assets * yieldR;
            const cost = debt * interestR;
            const net = income - cost;

            document.getElementById('outIncome').innerText = '$' + income.toLocaleString();
            document.getElementById('outCost').innerText = '-$' + cost.toLocaleString();
            document.getElementById('outNet').innerText = (net >= 0 ? '+' : '-') + '$' + Math.abs(net).toLocaleString();
        }
        update();
    </script>
</body>
</html>
