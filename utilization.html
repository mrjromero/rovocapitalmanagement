<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calibrated Margin Converter</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --border: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .converter-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        header {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .input-group:last-of-type {
            margin-bottom: 0;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            transition: border-color 0.15s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-green);
        }

        .input-wrapper input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.25rem;
            width: 100%;
            outline: none;
            font-weight: 600;
            text-align: right;
            padding-right: 0.5rem;
        }

        /* Hide spinner arrows for cleaner financial input */
        .input-wrapper input::-webkit-outer-spin-button,
        .input-wrapper input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-wrapper input[type=number] {
            -moz-appearance: textfield;
        }

        .input-wrapper .unit {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 1.1rem;
            width: 20px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="converter-card">
    <header>
        <h1>Calibrated Margin Converter</h1>
        <p>Direct Bi-Directional Conversion Calculator</p>
    </header>

    <!-- Debt-to-Asset Input -->
    <div class="input-group">
        <label for="dta-input">Debt-to-Asset (DTA) Ratio</label>
        <div class="input-wrapper">
            <input type="number" id="dta-input" step="0.01" min="0" max="100" placeholder="0.00">
            <span class="unit">%</span>
        </div>
    </div>

    <!-- Margin Utilization Input -->
    <div class="input-group">
        <label for="util-input">Margin Utilization Rate</label>
        <div class="input-wrapper">
            <input type="number" id="util-input" step="0.01" min="0" max="100" placeholder="0.00">
            <span class="unit">%</span>
        </div>
    </div>
</div>

<script>
    const dtaInput = document.getElementById('dta-input');
    const utilInput = document.getElementById('util-input');

    // Derived precisely from the calibration points: 27.70% / 55.76%
    const CALIBRATION_FACTOR = 27.70 / 55.76; 

    // Conversion: Util = DTA / Factor
    function convertFromDTA() {
        const dta = parseFloat(dtaInput.value);
        if (!isNaN(dta)) {
            utilInput.value = (dta / CALIBRATION_FACTOR).toFixed(2);
        } else {
            utilInput.value = '';
        }
    }

    // Conversion: DTA = Util * Factor
    function convertFromUtil() {
        const util = parseFloat(utilInput.value);
        if (!isNaN(util)) {
            dtaInput.value = (util * CALIBRATION_FACTOR).toFixed(2);
        } else {
            dtaInput.value = '';
        }
    }

    // Event listeners to handle real-time manual entry overrides
    dtaInput.addEventListener('input', convertFromDTA);
    utilInput.addEventListener('input', convertFromUtil);

    // Initialize layout with the requested default 20.00% DTA
    dtaInput.value = "20";
    convertFromDTA();
</script>

</body>
</html>
