<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Leverage Crossover Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #1e1e24;
            --panel: #2b2b36;
            --text: #f5f5f6;
            --accentA: #4ade80;
            --accentB: #60a5fa;
            --border: #3f3f4e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--panel);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .card h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #a1a1aa;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            background: #18181b;
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .crossover-alert {
            background: rgba(74, 222, 128, 0.1);
            border-left: 4px solid var(--accentA);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
            font-size: 1.1rem;
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Margin Leverage Crossover Calculator</h1>
    
    <div id="crossoverResult" class="crossover-alert">
        Calculating crossover...
    </div>

    <div class="grid">
        <div class="card">
            <h3>Global Parameters</h3>
            <label>Starting Capital ($)</label>
            <input type="number" id="startCap" value="10000" step="100">
            
            <label>Monthly Contribution ($)</label>
            <input type="number" id="monthlyContrib" value="2000" step="100">
            
            <label>Margin Rate (%)</label>
            <input type="number" id="marginRate" value="5.65" step="0.01">
            
            <label>Projection Months</label>
            <input type="number" id="months" value="60" step="12">
        </div>

        <div class="card" style="border-top: 3px solid var(--accentA);">
            <h3>Scenario A</h3>
            <label>Portfolio Yield (%)</label>
            <input type="number" id="yieldA" value="15" step="0.1">
            
            <label>Target LTV (%)</label>
            <input type="number" id="ltvA" value="25" step="1">
        </div>

        <div class="card" style="border-top: 3px solid var(--accentB);">
            <h3>Scenario B</h3>
            <label>Portfolio Yield (%)</label>
            <input type="number" id="yieldB" value="6" step="0.1">
            
            <label>Target LTV (%)</label>
            <input type="number" id="ltvB" value="35" step="1">
        </div>
    </div>

    <div class="chart-container">
        <canvas id="aumChart"></canvas>
    </div>
</div>

<script>
    let myChart = null;

    function calculateData() {
        const startCap = parseFloat(document.getElementById('startCap').value);
        const monthlyContrib = parseFloat(document.getElementById('monthlyContrib').value);
        const marginRate = parseFloat(document.getElementById('marginRate').value) / 100;
        const months = parseInt(document.getElementById('months').value);

        const yieldA = parseFloat(document.getElementById('yieldA').value) / 100;
        const ltvA = parseFloat(document.getElementById('ltvA').value) / 100;

        const yieldB = parseFloat(document.getElementById('yieldB').value) / 100;
        const ltvB = parseFloat(document.getElementById('ltvB').value) / 100;

        let eqA = startCap;
        let eqB = startCap;

        let dataA = [];
        let dataB = [];
        let labels = [];

        let crossoverMonth = -1;
        let initialLeaderIsA = false;

        for (let m = 1; m <= months; m++) {
            // Scenario A Calculations
            let assetsA = eqA / (1 - ltvA);
            let debtA = assetsA - eqA;
            let incomeA = assetsA * (yieldA / 12);
            let interestA = debtA * (marginRate / 12);
            eqA = eqA + (incomeA - interestA) + monthlyContrib;
            let finalAssetsA = eqA / (1 - ltvA);
            dataA.push(finalAssetsA);

            // Scenario B Calculations
            let assetsB = eqB / (1 - ltvB);
            let debtB = assetsB - eqB;
            let incomeB = assetsB * (yieldB / 12);
            let interestB = debtB * (marginRate / 12);
            eqB = eqB + (incomeB - interestB) + monthlyContrib;
            let finalAssetsB = eqB / (1 - ltvB);
            dataB.push(finalAssetsB);

            labels.push('Month ' + m);

            // Determine Crossover
            if (m === 1) {
                initialLeaderIsA = finalAssetsA > finalAssetsB;
            } else if (crossoverMonth === -1) {
                let currentLeaderIsA = finalAssetsA > finalAssetsB;
                if (currentLeaderIsA !== initialLeaderIsA) {
                    crossoverMonth = m;
                }
            }
        }

        return { labels, dataA, dataB, crossoverMonth, initialLeaderIsA };
    }

    function updateChart() {
        const results = calculateData();
        const ctx = document.getElementById('aumChart').getContext('2d');

        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: results.labels,
                datasets: [
                    {
                        label: 'Scenario A AUM',
                        data: results.dataA,
                        borderColor: '#4ade80',
                        backgroundColor: 'rgba(74, 222, 128, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        pointHitRadius: 10
                    },
                    {
                        label: 'Scenario B AUM',
                        data: results.dataB,
                        borderColor: '#60a5fa',
                        backgroundColor: 'rgba(96, 165, 250, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        pointHitRadius: 10
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed.y !== null) {
                                    label += new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(context.parsed.y);
                                }
                                return label;
                            }
                        }
                    },
                    legend: {
                        labels: { color: '#f5f5f6' }
                    }
                },
                scales: {
                    x: {
                        grid: { color: '#3f3f4e' },
                        ticks: { color: '#a1a1aa' }
                    },
                    y: {
                        grid: { color: '#3f3f4e' },
                        ticks: {
                            color: '#a1a1aa',
                            callback: function(value) {
                                return '$' + (value / 1000) + 'k';
                            }
                        }
                    }
                }
            }
        });

        // Update Alert Text
        const alertBox = document.getElementById('crossoverResult');
        if (results.crossoverMonth !== -1) {
            alertBox.innerHTML = `Crossover Achieved: The trailing scenario overtakes the leader at <strong>Month ${results.crossoverMonth}</strong>.`;
            alertBox.style.borderLeftColor = '#4ade80';
            alertBox.style.background = 'rgba(74, 222, 128, 0.1)';
        } else {
            alertBox.innerHTML = `No crossover detected within the projected timeframe.`;
            alertBox.style.borderLeftColor = '#facc15';
            alertBox.style.background = 'rgba(250, 204, 21, 0.1)';
        }
    }

    // Attach event listeners to all inputs to auto-update chart on change
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', updateChart);
    });

    // Initial render
    updateChart();
</script>

</body>
</html>
